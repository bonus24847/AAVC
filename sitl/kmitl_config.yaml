# AAVC field configuration — KMITL COMPETITION MAP (IAAI KMITL, the real event
# field). Used by the aavc-comp repo / the COMP launcher icon with
# AAVC_PROFILE=competition (30 m ceiling — 20 until the 28-Aug-2026 event
# briefing — 20 m transit, 10 m search floor).
#
# ⚠⚠ GEOMETRY IS APPROXIMATE. The airspace / search / transit coordinates below
# are the committee-published numbers from the rules PDF (AAVC2026 V1.3, p.3-4),
# NOT ground-surveyed. The no-RTK GPS common-mode bias can put the aircraft's own
# frame metres off them — SURVEY the field at the 28-Aug trial
# (docs/FIELD_SURVEY.md) and re-verify EVERY coordinate + the sweep axis + any
# no-fly zone before a scored flight. Only the aircraft/tuning blocks (battery,
# px4_tuning, marker, connection) are shared verbatim with the practice config
# (sitl/aavc_config.yaml) — it is the same aircraft.
#
# MISSION: an autonomous PX4 hexacopter delivers fragile egg cargo to landing
# pads matching the committee-ASSIGNED ArUco marker IDs (DICT_4X4_50, ids
# 1-6). The field carries all 6 physical pads; the committee assigns only 4
# per team, so the other 2 are permanent distractors (sitl.n_pads places all
# 6; search.max_pads tracks the same number for the sweep's early-stop). A
# FLIGHT (one arm->disarm cycle; internally state.sortie_index IS the flight
# counter — "sortie" and "flight" are used interchangeably in this repo)
# carries up to mission.eggs_aboard eggs (briefing override: 4 -> all four
# assigned eggs in ONE flight; eggs_aboard=1 is the original one-egg-per-
# flight model, still supported as a one-integer rollback). Each flight:
# takeoff at the Launch & Recovery site -> mandatory transit P1->P2->P3 at
# 20 m -> search the SEARCH AREA (10-30 m band since the 28-Aug briefing) ->
# for each assigned id in
# turn (a DELIVERY): land ON the pad -> release that delivery's egg after
# touchdown -> transit P3->P2->P1 -> land at L&R -> resupply -> next flight
# (<= max_sorties flights within the 20-minute operation window; scoring is
# PER DELIVERY, not per flight).
#
# Coordinate origin: site.center == ground_operation.launch_recovery == the
# LAUNCH & RECOVERY point. Everything that turns a pad's lat/lon into metres —
# the console feed (orchestrator/gcs_status.py), the radio beacon that carries
# the same numbers, the Svelte dashboard, sitl/spawn_targets.py — measures from
# it, and the console re-anchors what it receives at the VEHICLE's origin, so
# the two must be the same point or every pad slides by the difference.
#
# ⚠ Unlike the practice field, this frame is NOT generated by tools/gen_geo.py
# (that tool holds the KMUTNB pitch geometry only) and there is NO KMITL SITL
# world: sitl/launch_sitl.sh still spawns on kmutnb_skyfield.sdf at the practice
# L&R. So a SITL run against THIS config flies a route 31.5 km from where the
# vehicle spawns — it is a REAL-FLIGHT config, not a simulation one. Do the
# SITL work in the practice repo; build a KMITL world only if the 28-Aug survey
# is worth simulating (world <spherical_coordinates> + PX4_HOME_* + this
# site.center must then move together).
#
# Field frame: the search rectangle's long side bears ~87 deg true (W->E), so
# the sweep runs along it — see search.sweep_axis_deg. (The practice field's
# 143.2 deg pitch axis does not apply here; it was quoted in this line until
# 2026-08-22.)

site:
  # ⚠ FIXED 2026-08-22. This whole block was still the PRACTICE field's — name,
  # coordinates and rooftop altitude — 31.5 km from the KMITL L&R below, while
  # the comment on center_lat claimed the two were the same point. It was never
  # caught because nothing read it out loud: the flight core takes its home from
  # GPS, so the aircraft flew correctly while every pad coordinate the console
  # and the radio beacon carried was anchored 31.5 km away, putting every pad
  # marker off the map at the competition. orchestrator/main.py now resolves the
  # origin from ground_operation.launch_recovery and SAYS SO when the two
  # disagree; tests/test_geometry_invariant.py fails if they ever do again.
  name: "IAAI KMITL competition field (สนามแข่ง สจล. ลาดกระบัง)"
  city: "Bangkok"
  country: "Thailand"
  center_lat: 13.730322    # == ground_operation.launch_recovery (rules Table 1 P1)
  center_lon: 100.787446
  ground_alt_m: 2          # ⚠ ESTIMATE — Lat Krabang is a couple of metres AMSL.
                           # No flight code reads this key (tools/gen_geo.py uses
                           # its own KMUTNB constant), so it is documentation
                           # until something wires it to PX4_HOME_ALT. Measure it
                           # at the 28-Aug survey with the rest of the frame.

# Controlled airspace = the competition geo-fence. Uploaded to PX4 as an
# inclusion fence and watched by orchestrator/safety.py; leaving it mid-mission
# is a disqualification-grade violation. Vertices [lat, lon].
controlled_airspace:
  # ⚠ FROM THE RULES PDF (AAVC2026 V1.3, p.3) — the committee-published KMITL
  # coordinates, NOT ground-surveyed. VERIFY every vertex at the 28-Aug trial
  # before flying (docs/FIELD_SURVEY.md): the no-RTK GPS common-mode bias can put
  # the aircraft's own frame metres off these numbers. Reordered NW,NE,SE,SW so
  # the fence is a SIMPLE rectangle — the PDF lists them as corner PAIRS
  # (NW,NE,SW,SE), which as-is would upload a self-intersecting bowtie.
  - [13.731312, 100.787175]   # NW
  - [13.731359, 100.789916]   # NE
  - [13.729994, 100.789841]   # SE
  - [13.729806, 100.787228]   # SW

# Search area = what the sweep COVERS. ⚠ Since the 28-Aug-2026 briefing this
# is the rules' search area MINUS the two no-fly bands the operator marked on
# the gridded map (routing.keepout_zones below): an L — the open field WEST
# of the main building (E 41-125, full height) plus the strip NORTH of it
# (E 125-220, N 75-112). The rules' full polygon is kept below as
# search_area_rules (documentation; the GCS field file draws it).
# ⚠ The sweep is NOT generated from this polygon any more: build_search_pattern
# sweeps a polygon's bounding box, which would run every leg through the
# building band. The legs are laid out by hand in search.sweep_waypoints_enu
# (same ENU frame) and this polygon is what the dashboard draws + what a
# reviewer checks the legs against. Vertices [lat, lon], clockwise from NW.
search_area:
  - [13.731239, 100.787824]   # NW  = rules NW (ENU 40.9 E, 102.1 N)
  - [13.731284, 100.788607]   # north edge at E 125.6 (building band west edge)
  - [13.731334, 100.789479]   # north edge at E 219.8 (east band west edge)
  - [13.730998, 100.789479]   # E 219.8 / N 75.3 — the L's inner corner (top of the building band)
  - [13.730998, 100.788607]   # E 125.6 / N 75.3 — the building band's NW corner
  - [13.730715, 100.788607]   # E 125.6 / south edge — 2 m east of the corridor gate
  - [13.730723, 100.787840]   # SW  = rules SW (ENU 42.6 E, 44.6 N)

# The rules' FULL search area (PDF p.3, ~227 x 78 m) — DOCUMENTATION since
# 2026-08-28 (no flight code reads this key; the GCS field file draws it).
# Restore it as search_area only with a planner that routes around the
# building box.
search_area_rules:
  - [13.731239, 100.787824]   # NW
  - [13.731359, 100.789916]   # NE
  - [13.730703, 100.789776]   # SE
  - [13.730723, 100.787840]   # SW

# Primary transit route — MANDATORY both directions, scored per coordinate
# passed in order (rules PDF p.4 Table 1 + p.12 scoring matrix). Ingress
# P1->P2->P3 at transit_alt_m; egress reversed. P1 doubles as the RTH holding
# point; P3 sits on the search-area south edge (the ingress/egress gate).
transit_route:
  # ⚠ CHANGED AT THE 28-Aug-2026 EVENT BRIEFING. The committee moved the north
  # leg off the main building (the PDF's P3 sat on its roof — the building is
  # a no-fly band now, see routing: below). Coordinates = the OPERATOR'S OWN
  # line on the 20 m-gridded satellite map (28-Aug noon, after the briefing):
  # due north at E 123.7 m from L&R, from the P1->P2 line to the search-area
  # south edge — 2 m west of the building band he drew. Both points are
  # digit-for-digit in aavc-gcs/aavc_field.yaml (transit_waypoints).
  #   ⚠ If the committee published COORDINATES for the corridor, THOSE win.
  #   Superseded PDF Table-1 values, kept for the record:
  #     P2 [13.730397, 100.788694]  (ENU 135.0 E,  8.3 N)
  #     P3 [13.730712, 100.788755]  (ENU 141.6 E, 43.4 N — on the building)
  - [13.730322, 100.787446]   # P1  RTH / holding point (= L&R, unchanged)
  - [13.730390, 100.788590]   # P2' turn north  (ENU 123.7 E,  7.6 N; 11.3 m W of P2)
  - [13.730715, 100.788590]   # P3' search gate (ENU 123.7 E, 43.8 N; 17.9 m W of P3)

# ⚠ KMITL HAS a no-fly zone — rules Figure 1/3, the orange block on the EAST
# side, south of the search area's east end — but the PDF gives it as a
# picture only, no coordinates, so this list is EMPTY and the companion
# no-fly watchdog is BLIND here. Entering it is "strictly prohibited"
# (p.13; steep penalties / DQ). Get the vertices from the committee at the
# 28-Aug briefing and paste them here as [[lat, lon], ...] polygons. Until
# then: the PLAN never goes near it (the sweep is inset 8 m inside the search
# polygon, transit P1-P3 is west of it), and the one exposure is a FAILSAFE
# RTL from the EAST end of the search area — PX4 RTL flies a straight line
# home that hugs the block's northern edge (2026-08-27 review; safety-pilot
# brief: take over and exit along the corridor if an RTL fires out east).
# (The "no published no-fly zone on the practice field" text that sat here
# until 2026-08-27 was the PRACTICE file's.)
# ⚠ 2026-08-28: the operator marked the no-fly areas on the 20 m-gridded
# satellite map (after the briefing; his own boxes, ±3 m):
#   building band  the main building and the courtyard east of it, ENU
#                  E 125.6-266 / N 42-75.3 (the whole search-area width east
#                  of the building, below the north strip)
#   east band      the whole east end of the search area, E 219.8-266 / N 42-116
#   trees          18 m trees in the west field, crown E 79-94 / N 69-108 (redrawn 2026-08-29 11:21; was E 80-96 / N 70-110)
#   (the rules' orange block, E 219-255 / N -14..40 south of the search area,
#    still stands — it is outside anything the plan flies)
# DELIBERATELY NOT ARMED as watchdog polygons (operator's standing rule,
# 2026-08-27: no approximate polygon in the watchdog — a false RTH costs the
# flight; and the corridor he drew runs 2 m from the building band's west
# edge, which a watchdog polygon would RTH on every ingress). The PLAN avoids
# them instead — routing.keepout_zones below steers every goto around them
# and search.sweep_waypoints_enu keeps the legs out of them. To arm the east
# band (90+ m from anything the plan flies), paste:
# no_fly_zones:
#   - [[13.731362, 100.789479], [13.731362, 100.789906], [13.730699, 100.789906], [13.730699, 100.789479]]
no_fly_zones: []

# ── Plan-level keep-out routing (2026-08-28) ──────────────────────────────
# Every move the mission makes is a straight goto (sweep legs, decode visits,
# the hop to a pad, the egress to P3', the planned battery egress). With the
# building band in the MIDDLE of the L-shaped search area, a straight line
# from the north strip to the corridor gate / the west field / a candidate
# crosses it. orchestrator/mission.py::_goto_routed checks each goto against
# these polygons and, when the line crosses one, flies to `gateway` first —
# a point off the building band's NW corner from which every point of the
# west field, the north strip and the corridor gate has a clear straight
# line — then on to the target. Decode candidates and claimed pads inside a
# polygon (+3 m) are refused: the committee places pads in the open, so a
# "pad" in a band is a false hit, and visiting it would put the aircraft in
# the band. Nothing here RTHs — it is not a failsafe (no_fly_zones is).
# ⚠ What it cannot route: PX4's OWN failsafe RTL (a straight line home) —
# from the north strip east of E ~130 that line crosses the building band.
# Safety-pilot brief: if an RTL fires there, take over and bring the aircraft
# west along the strip first. Empty keepout_zones = every goto is the
# straight line it always was.
routing:
  keepout_zones:
    - [[13.730998, 100.788607], [13.730998, 100.789906], [13.730699, 100.789906], [13.730699, 100.788607]]   # building band  E 125.6-266 / N 42-75.3
    - [[13.731362, 100.789479], [13.731362, 100.789906], [13.730699, 100.789906], [13.730699, 100.789479]]   # east band      E 219.8-266 / N 42-116
    # 18 m TREES in the west field (operator, 15:20 after the trial: "ให้
    # ต้นไม้เป็น nofly zone") — drawn E 80-96 / N 70-110, kept with an 8 m
    # margin because the 15 m sweep flies BELOW the canopy top: E 72-104 /
    # N 62-118. Never overflown, never a decode-visit target.
    - [[13.731319, 100.788149], [13.731319, 100.788343], [13.730915, 100.788343], [13.730915, 100.788149]]   # trees (18 m)   E 76-97 / N 66-111 = drawn crown + 3 m (operator 2026-08-29 11:21, was E 72-104 / N 62-118 with an 8 m margin)
  # Via-points. mission.py::_goto_routed finds the SHORTEST chain of these
  # whose every segment stays out of the keep-outs (Dijkstra over
  # {here, gateways, target}), so a hop from the west column to the north
  # strip goes SW → SE → NE around the trees and the building, and the
  # egress from the west column goes SW → P3'. Each one sits in a lane that
  # sees its neighbours in a straight line:
  gateways:
    - [13.731068, 100.788509]   # NE  ENU 115 / 83 — off the building band's NW corner
    - [13.730843, 100.788482]   # SE  ENU 112 / 58 — the lane between the trees and the building
    - [13.730843, 100.788001]   # SW  ENU  60 / 58 — south of the trees, west field

# Ground operations — the Launch & Recovery point: on the pitch long axis,
# field-frame s=+24 (6 m in from the SE airspace edge, inside the penalty
# area). PX4 home is wherever the vehicle actually arms; this is the SITL
# spawn + planning home. GCS sets up beside it at the pitch edge.
ground_operation:
  # ⚠ KMITL L&R = the rules' Table 1 P1 (RTH/holding point). Pin the exact launch
  # slab at the trial and re-check that home sits INSIDE controlled_airspace.
  launch_recovery: [13.730322, 100.787446]     # rules Table 1 P1
  gcs_position: [13.730322, 100.787446]
  launch_recovery_zone_radius_m: 8

# Blind visual search INSIDE the search area — pad coordinates are unknown at
# takeoff; the committee only assigns marker IDs (up to eggs_aboard of them
# per flight). A flight whose assigned IDs are ALL already in the cross-
# flight pad registry skips the sweep entirely and flies direct (operator
# decision 2026-07-03: finish-sweep-then-serve — a sweep,
# once started, runs to completion (early-stop only when max_pads distinct IDs
# are confirmed) so the registry is filled for the remaining sorties).
#
# Ground TRUTH (with marker ids) is written by sitl/spawn_targets.py to
# /tmp/aavc_targets.json — used ONLY for the post-flight --truth-json audit and
# tools/verify_flight.py, NEVER for planning.
search:
  # ⚠ DELIVER-WHEN-FOUND (operator 2026-08-28 evening): the sweep no longer
  # runs to completion before the first egg. The moment an assigned id is
  # CONFIRMED (3 agreeing frames) the sweep pauses, the aircraft serves that
  # pad from where it is (hop → ladder → land → release → climb back to
  # sweep_alt_m) and the sweep resumes at the leg it left. Ids the sweep does
  # not find still go through the decode visits and are served afterwards.
  # Audit: `FLIGHT n SWEEP paused: pad=… confirmed — delivering now` /
  # `SWEEP resumed at wp k`. (orchestrator/mission.py `_serve_found`.)
  # ⚠ 12.0 -> 20.0 on 2026-08-28 (event briefing: ceiling raised 20 -> 30 m,
  # pads placed in the OPEN only — never on the building or beside an
  # obstacle; operator: "survey at 20 m"). The search area contains the main
  # building's northern half and a display aircraft, so the sweep altitude is
  # an OBSTACLE number first: 20 m clears both with margin (the committee's
  # own word is that 25 m clears everything on the field), and it is the same
  # altitude as the transit, so the outbound flight is ONE level from P1 to
  # the last sweep leg. What it costs is the marker: at 20 m the 400 mm
  # marker is 16.9 px (2.8 px/module) — UNDER the detector's validated 18 px
  # floor and well under the 25-35 px band proven in flight (2026-08-27) — so
  # the sweep is NOT expected to decode ids. It only has to SEE the pads: the
  # 1 m white pad is 42 px (blob floor 18 px); each white-pad candidate is
  # then revisited at the decode altitude (search floor 10 + 0.5 = 10.5 m,
  # mission.py::_decode_visits) where the marker is 32 px — inside the proven
  # band. Those visits are the new cost (~47 s each: descend 9.5 m at
  # MPC_Z_V_AUTO_DN 0.4, dwell decode_dwell_s, climb back), and the
  # committee's pads-in-the-open promise is what makes a 10.5 m visit over a
  # candidate safe. ⚠ A FALSE candidate on the building's roof would be
  # visited at 10.5 m too — the safety pilot watches every descent that starts
  # over the building. Laid out BY HAND for the
  # L-shaped area minus the tree block (sweep_waypoints_enu below; the
  # generated pattern would run through the building band and the trees).
  # At 15 m (swath 22.7): 7 legs, 454 m of legs+turns at 3.5 m/s, ~181 s;
  # marker 22.6 px, pad 56 px (the trial at 20 m / 17 px decoded 20-33 % of
  # frames per pass — 15 m is the altitude that turns that into a margin).
  # ⚠ NOT YET FLOWN: the 28-Aug trial slot is the one test — pass = every
  # placed pad becomes a white-pad candidate on the sweep AND decodes on its
  # visit.
  # (History: 8.0 -> 12.0 on 2026-08-22, review F1 — 8.0 was a KMUTNB number
  # under the practice 10 m ceiling and sat below the rules' 10 m floor.)
  sweep_alt_m: 15.0        # 20 -> 15 at 15:40 on 2026-08-28 (operator, once
                           # the trees became a keep-out: "ดังนั้นสามารถบิน
                           # sweep ที่ 15 m ได้"): marker 22.6 px instead of
                           # 16.9 — the trial decoded 20-33 % of frames per
                           # pass at 17 px, and every frame at >= 2 m. What
                           # remains under the legs at 15 m: the small display
                           # aircraft at ENU (111, 99) (tail ~5 m) and the round
                           # structure at (189, 99); the building and the trees
                           # are keep-outs. (12.0 until the morning; 20.0 for
                           # the trial.) LEGAL BAND HERE: >= 10 m (rules),
                           # <= 30 m (briefing). The profile's ceiling clamps it
                           # with min() — never upward.
  # The sweep itself, laid out BY HAND (2026-08-28) as [east, north] metres
  # from L&R (ground_operation.launch_recovery — the frame every ENU number
  # in this file uses). Read by orchestrator/main.py::_build_spec →
  # mission_brain/search_pattern.py::build_explicit_pattern; when this key is
  # present the polygon planner is bypassed. SEVEN E-W legs at the 15 m swath
  # (22.7 m; legs 14-16 m apart = the validated 0.30 overlap), flown at
  # search.speed_mps in this order. Redrawn 15:40 after the trial: the
  # operator marked an 18 m TREE BLOCK in the west field (E 80-96 / N 70-110)
  # as a keep-out — routing.keepout_zones[2], carried with an 8 m margin
  # because at 15 m the aircraft flies BELOW the canopy top — so no leg or
  # transition enters E 72-104 / N 62-118; the west column (E 46-66) gets
  # three short legs reached from the south, the north strip (E 110-205)
  # two, reached from the corridor gate. Held heading = sweep_axis_deg (87)
  # minus the camera mount, as always.
  #   N1  (116,86) → (208,86)   north strip; starts 10 m east of the lane, ends 15 m short of the east band
  #   N2  (208,102) → (102,102)   north strip, ends 4 m east of the tree keep-out (E 97)
  #   T   (102,102) → (102,66)   tree-side pass at E 102: covers the strip the smaller keep-out freed (E 97-107), 5 m from its edge
  #   →   (102,66) → (116,66)   transition east, along the keep-out's south edge (N 66)
  #   ↓   (116,66) → (116,53)   the lane between the trees and the building (E 125.6)
  #   L1  (116,53) → (46,53)   lower band, 13 m south of the tree keep-out
  #   W1  (46,72) → (66,72)   west column; ends 10 m short of the keep-out (E 76)
  #   W2  (66,86) → (46,86)   west column
  #   W3  (46,100) → (66,100)   west column
  # The exit from W3's end to P3' crosses the tree box in a straight line, so
  # the egress goto routes itself through routing.gateways (SW → gate).
  # Coverage is pinned by tests/test_keepout_routing.py: every 2 m grid point
  # of the L outside the keep-outs (+3 m) within 10 m of a leg (a realistic
  # usable half-swath at 15 m). Re-run it after ANY edit.
  sweep_waypoints_enu:
    - [116.0, 86.0]
    - [208.0, 86.0]
    - [208.0, 102.0]
    - [102.0, 102.0]
    - [102.0, 66.0]
    - [116.0, 66.0]
    - [116.0, 53.0]
    - [46.0, 53.0]
    - [46.0, 72.0]
    - [66.0, 72.0]
    - [66.0, 86.0]
    - [46.0, 86.0]
    - [46.0, 100.0]
    - [66.0, 100.0]
  # ✅ 0.44 -> 0.30 on 2026-08-24, after the SITL test the operator asked for.
  # 0.44 was belt-and-braces for an UNMEASURED camera mount: if the wide image
  # axis did not lie across track the real swath was the 720 px axis and 0.30
  # left a 2.5 m gap per strip. The mount was MEASURED 2026-08-23 (180 deg,
  # four placements) and search_pattern.py now derives a nose-first heading, so
  # the wide axis is across track BY CONSTRUCTION — the assumption 0.44 insured
  # against cannot occur any more.
  # Flown head to head in SITL at KMITL optics (12 m sweep, 400 mm marker at
  # 28 px), same pad seed 1301, competition envelope:
  #        pads found  ids correct  eggs  release err     mission
  #   0.30    6/6         6/6        4/4  0.09-0.22 m      536 s
  #   0.44    6/6         6/6        4/4  0.15-0.20 m      647 s
  # Identical coverage and identical delivery success; 0.30 is 111 s faster on
  # that field and a computed 158 s faster on KMITL's larger polygon. Decode was
  # separately verified to work at EVERY across-track offset out to 94 % of the
  # half-swath, so the wider spacing never puts a pad where the detector fails.
  overlap_frac: 0.30       # spacing = swath*(1-overlap); see above
  margin_m: 5.0            # search-area inset (pads sit >=4 m inside; GPS is coarse)
                           # RAISED 4.0 -> 5.0 on 2026-08-16, executing the
                           # trigger the 2026-08-12 peer note wrote down: at 4.0
                           # the outermost sweep leg sat 5.93 m from the AIRSPACE
                           # edge against the watchdog's 5 m proximity warn —
                           # 0.9 m of slack. The operator then reported that real
                           # flights at this field kept tripping the geofence in
                           # strong wind (they were sys-ID chirps, which excite
                           # the aircraft deliberately, so this is corroboration
                           # rather than a like-for-like sweep result). 5.0 buys
                           # ~1.9 m of slack and costs no coverage: the camera
                           # swath at 4 m alt (~9.5 m) still reaches 0.25 m past
                           # the search boundary.
                           # ⚠ The real cure is the FIELD SURVEY, not this knob.
                           # The airspace polygon is only 60 x 44 m because it
                           # came from the OLD brief; the expanded KMUTNB field
                           # (L&R at the NW running track) should give far more
                           # room, and these insets want re-deriving from it.
  speed_mps: 3.5           # The SWEEP's cruise speed — since 2026-08-28 it IS
                           # commanded: mission.py writes it to MPC_XY_CRUISE for
                           # the sweep legs and hands the px4_tuning pin (5.0)
                           # back afterwards, so transit and pad hops run at 5.
                           # 3.5 (not 5): the 20 m decode rate over a pad was
                           # 20-33 % of frames at 2.7 m/s on the trial — fast
                           # enough for confirm_votes 2 at 3.5, marginal at 5.
                           # Also feeds the plan's duration estimate + leg
                           # timeouts.
                           # 9.5 m footprint -> 3.2 s -> ~10 frames @3.3 Hz
  # Field-frame sweep axis (NEW, read by orchestrator/main.py _build_spec ->
  # mission_brain/search_pattern.py): true heading of the pitch long axis. The
  # KMITL search polygon long axis bears ~E (the field runs roughly E-W). The
  # sweep grid rotates by this so legs run ALONG the long side, not across the
  # ENU bounding box (whose corners fall outside the fence).
  # ⚠ APPROXIMATE — computed from the rules-PDF corners (NW->NE bearing ~87 deg),
  # NOT surveyed. Re-measure at the 28-Aug trial; a few degrees off walks the
  # sweep legs off the polygon ends.
  sweep_axis_deg: 87.0
  confirm_votes: 2         # decoded NADIR votes to CONFIRM an id-cluster into the
                           # registry. The land gate re-verifies the id AT the
                           # pad, so a mis-registered pad defers, never mislands.
  min_confidence: 0.5      # per-vote confidence gate
  min_span_s: 0.6          # votes must span this long (temporal consistency)
  cluster_radius_m: 5.0    # spatial merge for unidentified (blob-only) candidates
                           # (8 would merge neighbours: pads are 14.5 m apart here)
  target_radius_m: 0.2     # marker half-side (m) -> size-prior gate (PadHit.radius_px
                           # is marker-equivalent px, also for blob-only hits)
  radius_band: [0.4, 2.5]  # size-prior acceptance band (decode is the identity gate)
  max_fix_ground_dist_m: 20.0  # reject near-horizon junk from a tilted frame edge.
                           # 15 -> 20 on 2026-08-28 with the 20 m sweep: the
                           # half-swath is now 15.1 m (9.1 at 12 m), so 15
                           # threw away every pad in the outer metre of a
                           # level frame and the whole far edge of a tilted
                           # one — a pad seen only from a leg's edge lost its
                           # votes. 20 keeps the full flat swath; the junk it
                           # exists to reject is tens of metres out. (The "15
                           # spans the 60 m pitch" text that stood here was the
                           # PRACTICE field's.)
  serve_dedupe_m: 6.0      # served-pad dedupe radius (default 12 would swallow
                           # a neighbouring pad at the new 14.5 m separation)
  decode_dwell_s: 4.0      # hover time over an unidentified candidate to decode its ID
  serve_cost_s: 90.0       # time budget: align + land-ON + release + climb out.
                           # 105 -> 90 on 2026-08-28 evening: the ladder ends at
                           # 2 m (no 1.5 m rung), the climb-out runs at 2.5 m/s
                           # and the per-rung descent speeds (3/3/1.5/0.8/0.5)
                           # should now actually land on the board (their param
                           # sets timed out on the throttled link). Still
                           # conservative against the trial's measured pieces.
  # ⚠ All three were KMUTNB-sized numbers left in a KMITL file (review F5,
  # 2026-08-22). The gate that decides whether another flight/delivery fits
  # the window was computing against a field a third of the size, so it
  # approved work it could not finish — and the per-delivery abort gate reads
  # the same numbers, so it could not catch it either.
  sortie_cost_s: 820.0     # FULL-SWEEP 4-EGG sortie, rebuilt 2026-08-28 evening
                           # (7 legs at 15 m around the trees, sweep 3.5 m/s,
                           # transit/hops 5 m/s): takeoff 17 + ingress 32 (160 m
                           # at 5) + 12 to leg N1 + sweep 152 (418 m of
                           # legs+turns at 3.5) + 2 decode visits x 40 = 80 (at
                           # 22.6 px most pads decode IN the sweep) + 4 x
                           # serve_cost_s 90 = 360 + 22 exit via the SW gateway
                           # + egress 32 + land 35 = 759 s. Egg 4's gate runs with
                           # 620 s left against its 300 s floor; the launch gate
                           # stacks 180 + this + 30 = 1030 <= 1200.
                           # (Earlier today: 985 capped for the 4-leg 3 m/s plan;
                           # 2026-08-24: 900 at the 12 m sweep of the full
                           # polygon, cross-checked against the 536 s SITL run.)
  known_sortie_cost_s: 200.0  # registry-known sortie, no search. 2026-08-28
                           # evening: the far corner of the L (the west column,
                           # via the SW gateway) is 268 m by way of the
                           # corridor = 54 s each way at MPC_XY_CRUISE 5, plus
                           # one serve (90) = 197. (Before: 280 at 3 m/s;
                           # 140 was the KMUTNB number.)
  rth_reserve_s: 120.0     # egress + land at L&R from the FAR side. Measured:
                           # the far corner of the search polygon is 291 m out,
                           # ~97 s of flight before the wheels touch — the old
                           # 45 s came with a comment saying "the far corner is
                           # only ~75 m out", which is the practice field.
  # Pads PLACED on the field (event briefing: 6 physical pads; sitl.n_pads
  # spawns all of them) — NOT the rules' old "up to four (4)", which is how
  # many the committee ASSIGNS per team (mission.assigned_marker_ids / the
  # queue, still a 4-subset). Gates the SWEEP's early-stop: _sweep_for._done()
  # in orchestrator/mission.py stops once this many DISTINCT ids are confirmed
  # in the registry ("nothing left to find") — leaving it at 4 would let the
  # sweep stop after any 4-of-6, which might not cover all 4 assigned ids.
  max_pads: 6

# Mission parameters (V1.3 delivery flight + the 2026-07-24 event-briefing's
# FLIGHT ⊃ DELIVERY split — docs/RULES_AAVC2026.md "Event-briefing override")
mission:
  # ⚠ ceiling/transit here are DOCUMENTATION ONLY — the values the orchestrator
  # actually flies come from mission_brain/profile.py, and THIS file is flown
  # with the COMPETITION profile (.aavc_site: AAVC_PROFILE=competition).
  # Discovered the hard way 2026-08-18, when an edit here changed nothing.
  # Keep both in sync; change the PROFILE to change the flight.
  # ⚠ CORRECTED 2026-08-22: these three carried the practice field's numbers
  # (10 / 9.0 / 2.5) inside a competition config — harmless to the aircraft,
  # which reads the profile, but this block is what a human reads when writing
  # the briefing, and it contradicted this file's own header.
  altitude_ceiling_m: 30            # hard AGL ceiling: 20 -> 30 at the 28-Aug-2026
                                    # event briefing (enforced by the companion:
                                    # warn 30.5 / RTH 31.5); the FC's own fence
                                    # (GF_MAX_VER_DIST) is a 50 m gross-runaway net
                                    # only — PX4 1.17 moves home.alt in flight
                                    # (2026-08-26). tools/verify_flight.py reads
                                    # THIS key for its ceiling line.
  transit_alt_m: 20                 # transit legs AT 20 m, both directions
                                    # (rules Table 1 — scored per point; the
                                    # briefing raised the ceiling, not this)
  search_floor_m: 10                # search 10-30 m; below 10 only over the pad
  # DELIVERIES (pads to serve), not flights, despite the name: this predates
  # the FLIGHT/DELIVERY split. orchestrator/main.py reads mission.max_deliveries
  # FIRST and only falls back to THIS key when max_deliveries is absent from
  # config, so its value must keep meaning "how many pads" for that fallback
  # to still resolve correctly. Left at 4 (matching max_deliveries below) on
  # purpose rather than renumbered to "1 flight" — with max_deliveries set
  # explicitly here, this value has NO effect on the current run (the actual
  # FLIGHT budget, state.max_sorties, is recomputed from max_deliveries ÷
  # eggs_aboard below — see main.py), but it stays the correct fallback
  # value for any config/test that omits max_deliveries and still expects
  # the old "max_sorties == pads" contract.
  max_sorties: 4
  # Pads to serve in the window (briefing: 4 assigned of the 6 physically
  # placed — sitl.n_pads / search.max_pads above). Explicit now rather than
  # relying on the max_sorties fallback described above.
  max_deliveries: 4
  # Eggs carried per FLIGHT (one arm->disarm cycle). Briefing override: ALL
  # FOUR assigned eggs fly in ONE flight (main.py seeds state.eggs_aboard from
  # this, then mission_brain/flights.py:chunk_flights splits the assigned-id
  # queue into flight-sized chunks). The actual flight budget,
  # state.max_sorties, is mission_brain/flights.py:budgeted_flights_for —
  # ceil(max_deliveries / eggs_aboard) floored at 2 whenever there is
  # anything to deliver, so a flight that comes home with undelivered eggs
  # gets one automatic recovery flight (I5, review 2026-07-24); that floor is
  # 2 at these defaults, not 1 (ceil(4/4)=1 alone would leave zero spares).
  # Set to 1 to roll back to the original one-egg-per-flight model — fully
  # supported and regression-tested (mission_brain/flights.py, test_flights.py,
  # test_delivery_mission.py::test_eggs_aboard_1_is_one_delivery_per_flight).
  eggs_aboard: 4
  # Land-ON touchdown scatter vs the pad centre. The "0.44-0.53 m scatter"
  # measured before 2026-07-04 was mostly a TRUTH-COORDINATE bug (spawn_targets
  # used the equatorial radius for the north axis → truth ~0.5 m south of the
  # real pad); with the WGS84 fix the tuned 4-sortie mission releases at
  # 0.09-0.30 m and the id-truth audit reads 0.10-0.14 m — the real capability.
  # 0.5 m keeps every gear leg on the 1 m pad with margin; KMUTNB is
  # accuracy-focused and the whole approach happens under 4 m with a 54+ px
  # marker. Measured on this field (2 full missions, 8 drops, 2026-08-12):
  # release-vs-truth 0.03-0.30 m, align lock 0.03-0.19 m. 0.35 = the
  # demonstrated envelope + the ±0.1 m truth-frame noise a GPS-frame audit
  # carries on top of the vision lock (a 0.30 sample tripped a strict 0.3).
  landing_accuracy_threshold_m: 0.35
  # Headless/SITL assignment source: the marker IDs the committee would hand
  # over per sortie (dashboard operators enter them per-sortie instead).
  # Empty = dashboard-only. `make run` CLI: --assigned-ids "3,1,4,6".
  assigned_marker_ids: []

# Landing-pad marker set. The pads are white 1x1 m with a black ring and a
# central ArUco marker; chev.me/arucogen "4x4" = OpenCV DICT_4X4_50, ids 1..6
# (rules Figure 7). Only `valid_ids` is read here (by sitl/spawn_targets.py) —
# the actual pad GEOMETRY (marker/pad/circle sizes, quiet zone) and the decode
# dictionary are the single source of truth in vision/detectors/aruco.py
# (PAD_DICT, PAD_SIZE_M, MARKER_SIZE_M, CIRCLE_*); editing them here would be a
# no-op. Regenerate the SITL pad models with tools/gen_pads.py after a change.
marker:
  valid_ids: [1, 2, 3, 4, 5, 6]

# SITL-only pad-placement config, read by sitl/spawn_targets.py ONLY (never by
# the flight code — the mission discovers pads by blind visual search, never
# this file). Event briefing: the real field carries all 6 physical pads
# (marker.valid_ids); the committee assigns just 4 per team, so a --seed
# layout (and the world file's static baseline) places all 6 by default — the
# 2 unassigned ids become permanent distractors the id-verified LAND gate
# must keep rejecting across a whole mission, not something it never meets.
sitl:
  n_pads: 6            # `--n-pads` on the CLI overrides this for one run
  # `--n-pads` has NO effect on a no-seed spawn (the static 6-pad baseline).

# Camera intrinsics + mounting for the pixel->ground projection
# (vision/projection.py via configure_cameras). MUST match the SITL eft_x6100
# camera sensor (1.295 rad / 1280x720, mounted 0.25 m below the CG on the
# centreline — user spec 2026-08-11, same plane as the rangefinder). The
# single NADIR camera = sole control authority AND the ArUco decode camera.
# REAL HARDWARE: WSD-9781-v12 module — 1280x720. fov_deg MEASURED 2026-08-17
# on the real lens (50 mm marker at 0.495 m → 85.5 px avg over 3 sharp
# frames → fx 847 px → 74.2°, ±1°); replaces the 99.7 unmeasured placeholder.
# Consequence: the ground swath is ~0.66x the placeholder's, so sweeps grow
# more legs — spacing is fov-derived (search_pattern.py), no coverage gaps.
# Still open: residual mount pitch (depression_deg trim) at the field.
cameras:
  nadir:                  # the single control-authority + decode camera
    fov_deg: 74.2         # MEASURED 2026-08-17 (bench, ±1°) — see comment above
    width_px: 1280
    height_px: 720
    depression_deg: 90.0  # optical axis below horizontal; 90 = straight down
    # Rotation of the camera about its optical axis vs the airframe: 0 = image
    # "up" points at the NOSE, image-right at the right wing; + = clockwise
    # seen from above. MEASURED 2026-08-23 on the aircraft (KMUTNB bench):
    # 180 — the camera is bolted UPSIDE DOWN, so the image's top row looks at
    # the TAIL, not the nose. Four independent placements of a floor object
    # (nose / right / tail / left, aircraft raised ~0.75 m and level) each
    # solved it alone: 180.3, 187.4, 183.4, 186.1 (mean 184.3). Snapped to the
    # bolted 180; the ~4 deg residual is placing-by-eye error, worth 0.63 m at
    # the 12 m sweep. The old 0.0 was an ASSUMPTION and it was wrong by ~175
    # deg in EVERY direction, so every pixel->lat/lon fix came out
    # point-mirrored about the aircraft — which is exactly what a sweep that
    # sees pads and never re-acquires them looks like.
    # It moves two things: the pixel->lat/lon bearing (a 90 deg error reports a
    # frame-edge pad ~13 m from where it is, at the 12 m sweep) and the heading
    # the sweep holds (search_pattern.sweep_yaw_deg = leg bearing - this).
    # SITL cannot catch an error here — the gz camera shares the assumption.
    # RE-MEASURE with tools/measure_mount_yaw.py after any camera re-mount.
    mount_yaw_deg: 180.0

# Vision worker + terminal-align frame handling.
vision:
  # In-flight frame-staleness gate (S2): reject a nadir frame whose
  # mtime is older than this. The camera bridge/grabber writes by atomic
  # replace, so a dead writer freezes the LAST frame on disk — without this the
  # descent would keep decoding a frozen pad and the id-verified LAND gate could
  # be fooled. Frames arrive at 5-15 Hz, so 2 s is many missed frames (not a
  # transient). Set to 0 to DISABLE (e.g. a slow bench camera). Feeds both the
  # VisionWorker and AlignParams.frame_max_age_s.
  frame_max_age_s: 2.0
  # ── matched to the PRACTICE config 2026-08-26 (operator: "sensor settings
  # the same as PRACTICE" for the 28-Aug competition). Both keys were missing
  # here, so this field ran the code defaults — ONE decode worker polling at
  # 0.05 s against the practice field's two workers at 0.02 s, i.e. about half
  # the decode attempts per sweep. These are the values behind the
  # 2026-08-26 flight that decoded 155 frames (ids 1/2/4/5) in a 2-leg sweep.
  # How often the worker LOOKS for a new frame — not how often it decodes
  # (a new-frame guard sits in front of the decode); this only bounds the
  # wait before a fresh frame is picked up.
  poll_interval_s: 0.02
  # Frames decoded CONCURRENTLY. 2 goes with the grabber's --mjpeg-passthrough
  # (20-30 Hz for ~7% of a core); cv2 releases the GIL so the extra worker is
  # a real core, and results stay in frame order.
  decode_workers: 2

# Mission frame recorder (R2 — the RECORD half of the rules' "record AND transmit"
# imaging requirement). Persists a low-rate JPEG trail of the nadir frames
# into runs/<mission_id>/frames/ for post-flight review / scoring
# evidence. Runs OFF the flight-critical path (any failure = one WARN, never
# mission-fatal). ~1 Hz × 20 min ≈ 200-300 MB — size the CM4 SD card accordingly.
recording:
  enabled: true
  # 1.0 -> 5.0 (matched to PRACTICE 2026-08-26): every post-flight debrief of
  # this project lived on these frames — the 2026-08-26 exposure diagnosis
  # (pad clipped at 255) came from a 5 Hz trail. ~8% of one CM4 core and
  # ~0.5 GB per 20-min window.
  hz: 5.0               # nadir frames per second
  jpeg_quality: 80      # cv2 JPEG quality 0-100

# FC link + egg-release servo (mavlink_adapter.ConnectionConfig). All optional —
# omit a key to keep the dataclass default. `--connect` overrides system_address.
# For the REAL 6X on the CM4, set system_address to the onboard link:
#   serial:///dev/ttyAMA0:921600   (direct UART)  OR
#   udpin://0.0.0.0:14540          (via an onboard mavlink-router; also feeds QGC)
connection:
  # system_address: udpin://0.0.0.0:14540   # (left to --connect / the default in SITL)
  # Release-actuator BASE INDEX for MAV_CMD_DO_SET_ACTUATOR (the only release
  # command PX4 implements — it has NO DO_SET_SERVO handler; discovered
  # 2026-08-11 reading v1.17 source, which also means the old "AUX 9..12
  # DO_SET_SERVO" plan could never have worked). payload_id 0..3 -> actuator
  # set 1..4 -> PX4 output function "Peripheral via Actuator Set 1..4"
  # (301..304). SITL: airframe 22000 maps those onto SIM_GZ_SV_FUNC1..4, so
  # each release shows on gz topic /model/eft_x6100/servo_<n-1> and
  # payload_detach_bridge --servo sheds the matching cargo box. REAL AIRCRAFT:
  # AUX pin number == actuator set index == outputs[] in the console's field
  # file (this field: aavc-gcs/aavc_field.yaml — gcs/kmutnb_field.yaml is the
  # practice console's, named here until 2026-08-22)
  # (PWM_AUX_FUNC1..4 = 301..304, DIS/FAIL = 1100 — hold; a failsafe must never
  # drop cargo). Full table + QGC bench checklist: docs/SERVO_AUX_MAPPING.md.
  # Rack geometry (±0.10, ±0.035) m about the CG, user spec 2026-08-11.
  # aavc-gcs sends the identical command (aavc_field.yaml outputs
  # [1,2,3,4] = one button per AUX pin / 1900 / 1100).
  drop_servo_channel: 1          # base index, used only if the map below is empty
  # AS-WIRED payload_id -> actuator set (user report 2026-08-15, superseding the
  # 2026-08-12 paper lock that assumed pin order == delivery order). Bench
  # wiring, "top" = the drone's nose end:
  #   front-left = AUX 4 | front-right = AUX 2 | rear-left = AUX 3 | rear-right = AUX 1
  # The release ORDER stays diagonal (front-left -> rear-right -> front-right ->
  # rear-left) so the CG moment stays ~zero full, after 2 eggs, and empty:
  drop_servo_channels: [4, 1, 2, 3]
  drop_servo_pwm_release: 1900   # us -> +0.8 normalized, egg-release position
  drop_servo_pwm_hold: 1100      # us -> -0.8 normalized, closed/hold position
  # 2026-08-28 (operator, after the 17:28 KMITL flight — 2/2 delivered, latch
  # re-closed 0.6 s after each release): the latch now stays OPEN after the
  # release for the rest of the flight. PX4 drives every AUX pin to
  # PWM_AUX_DISn (1100 = closed) at DISARM, so the rack closes itself at L&R
  # for the resupply crew. true = the old release -> 0.6 s -> hold pulse.
  drop_servo_relatch: false
  # Fallback release path (raw COMMAND_LONG over pymavlink) if MAVSDK's
  # set_actuator is ever rejected. The dataclass default is PX4 SITL's 18570 —
  # nothing listens there on the CM4 (found 2026-08-29). 14550 is the
  # mavlink-router's loopback Server endpoint that the status beacon already
  # speaks to every second, so a client heartbeat there registers and the
  # command is routed to the FC.
  drop_fallback_endpoint: udpout:127.0.0.1:14550
  # Four INDEPENDENT release mechanisms (briefing override: all four eggs fly
  # in one flight; rules §7 permits multiple cargo only with independent
  # release mechanisms, never simultaneous).
  drop_payload_count: 4
  # drop_fallback_endpoint: udpout:127.0.0.1:14550  # only used if set_actuator is
                                 # rejected; point at a mavlink-router that reaches the
                                 # FC. Default is a SITL-only localhost port.
  # Optional raw pymavlink listener (dashboard ESC/servo/consumed-mAh widgets —
  # MAVSDK doesn't expose those). 0/absent DISABLES it.
  # KMUTNB 2026-08-12: DISABLED — udp 14550 (PX4's GCS broadcast) can have ONE
  # listener, and the user-mandated AAVC GCS console (`make aavc-gcs`) now owns
  # it for telemetry + manual servo release. The dashboard loses only those
  # cosmetic widgets (documented graceful degradation; the safety watchdog
  # never reads these fields). To get both, add a second MAVLink instance in
  # PX4 (e.g. `mavlink start -u 18571 -o 14551` via pxh) and set 14551 here.
  # ⚠ …but NOT on the current wiring (2026-08-18; unchanged by the PM02D
  # installed 2026-08-20 — it powers the FC only). The consumed-mAh counter it
  # carries is avionics-only since the PM03D went out (measured 0.62 A / 91 mAh
  # on the bench vs ~35-43 A in flight), and feeding it in flips
  # energy_consumed_mah() to tier A — a silently optimistic pack budget that
  # stops refusing flights the battery cannot finish. 0 keeps the honest
  # voltage-derived tier B. See the same warning in cm4/launch_flight.sh.
  raw_telemetry_port: 0

# Wind model for SITL (Bangkok SW monsoon; a rooftop pitch is fully exposed, and
# so is KMITL). ⚠ NOT READ BY ANY CODE — this block is the written intent; the
# numbers that actually blow live in the WORLD file
# (sitl/worlds/kmutnb_skyfield.sdf: <wind><linear_velocity> for the base vector,
# the WindEffects plugin for gusting). Keep the two in step by hand.
# ⚠ And wind only reaches the aircraft because the airframe model opts in with
# <enable_wind> (added 2026-08-15). Before that, this block and the plugin both
# existed while every flight — G4/G4' included — was actually flown in still
# air: the plugin pushes only links that ask for it.
wind_sitl:
  # MEASURED-BY-OPERATOR 2026-08-15: 8-12 m/s at BOTH the KMUTNB rooftop pitch
  # and the KMITL competition field this month (Beaufort 5, "fresh breeze").
  # That is 2-3x the 4 m/s "monsoon" figure this block used to carry, which was
  # a seasonal guess and nothing more — and 3-4x the 3 m/s MPC_XY_CRUISE the
  # mission flies at, so upwind legs cost real airspeed.
  base_speed_mps: 10
  gust_amplitude_mps: 2    # world sine is +/-20% of base -> the 8-12 m/s band
  direction_deg: 225   # FROM the south-west -> blows toward NE
                       # -> world vector (10*sin45, 10*cos45) = (7.07, 7.07) ENU

# Outer-loop flight tuning applied once before takeoff (orchestrator.main →
# commander.apply_param_overrides). Operator intent: fly stably (less overshoot),
# LIMIT max tilt (anti-flip), LIMIT yaw rate, UNLOCK speed — fastest-but-safe.
# These are the AUTO/position-controller LIMITS; the inner-loop MC_*RATE_* PID
# gains come from the pre-flight System-ID + Autotune module. Omit this block to
# use mavlink_adapter.commands.DEFAULT_PX4_TUNING. Verify in SITL before flight.
# ⚠ 2026-07-22 airframe swap: the aircraft is now a 7.17 kg EFT X6100 hexacopter
# (1.000 m wheelbase, 18" props, 37.65 N/motor — Power-System-Guide-1.pdf), not
# the ~2 kg quad these numbers were tuned on. The caps below were first derived
# against a 6.2 kg catalog estimate and kept when the mass was corrected: the
# headline term g*tan(30 deg) is mass-independent, and the envelope was
# re-validated on the corrected model (G4 19 checks / 0 warnings, three runs).
# The tilt/accel/jerk/speed caps are per-line documented; the SAFETY pins
# (MPC_Z_V_AUTO_DN, MPC_Z_VEL_MAX_UP, MPC_TKO_SPEED, MPC_LAND_*, RTL_RETURN_ALT,
# COM_DISARM_LAND, NAV_ACC_RAD) are deliberately UNCHANGED — they encode
# egg/ceiling/scoring rules, not airframe dynamics. Re-open the cruise caps only
# after a G4 run shows the 20-minute window has margin.
px4_tuning:
  MPC_TILTMAX_AIR: 30.0     # anti-flip: cap auto tilt (deg) — 35 on the quad
  MPC_MAN_TILT_MAX: 30.0    # anti-flip: cap manual tilt (deg)
  MC_YAWRATE_MAX: 45.0      # limit body yaw rate (deg/s). The hexa's Izz is ~15x
                            # the quad's against ~0.4x the yaw authority per
                            # newton of thrust, so it cannot chase 50 deg/s.
  MPC_YAWRAUTO_MAX: 25.0    # gentler auto heading slews (deg/s) — the dominant
  # Heading behaviour in AUTO. PX4 default 0 = yaw TOWARDS each waypoint —
  # which spins the body-fixed nadir camera at every sweep-leg turn, adding
  # rotational blur to already-marginal in-flight frames (G7 attempt #1:
  # 1-of-457 recorded frames decodable). 5 = YAW FIXED (verified against the
  # v1.17 source, multicopter_autonomous_params.c — NOT 4, which is
  # towards-waypoint-yaw-first): the hexa strafes its legs holding one
  # heading and the image never rotates. Operator decision 2026-08-21.
  MPC_YAW_MODE: 5
                            # yaw-speed limit in AUTO. Lower further if still snappy.
  MPC_XY_VEL_MAX: 5.0       # horizontal speed ceiling (m/s). KMUTNB: the longest
                            # leg is ~52 m and accuracy is the goal — 10 m/s
                            # buys nothing on this field and doubles overshoot.
  MPC_XY_CRUISE: 5.0        # auto cruise speed (m/s) for TRANSIT and pad HOPS.
                            # 3 -> 5 on 2026-08-28 (operator, after the trial:
                            # "บินช้าเกินไป เปลืองพลังงาน"): the whole flight
                            # drains ~13 gauge points a minute at ~44 A, so
                            # every second airborne is the budget — the trial
                            # flew 2.7 m/s average and ran out at 20 % with no
                            # egg delivered. The sweep runs slower
                            # (search.speed_mps, set live). = MPC_XY_VEL_MAX.
                            # (Old note, KMUTNB accuracy-over-speed brief:
                            # slower sweep = more frames per pad = reliable
                            # decode + tight leg tracking. 20-min window has
                            # ~4x margin at this speed on the small field.
  # No arm/disarm cycle at the mid-sortie pad landing: touch down ON the pad,
  # release the egg, take off — ARMED throughout. Also pins PX4 home to the
  # LAUNCH point while airborne (home is re-captured at every arming; the
  # vehicle only re-arms at the L&R site between sorties).
  COM_DISARM_LAND: -1.0     # disable auto-disarm on landing (default 2 s)
  # ── AUTO smoothness. The mission flies AUTO end to end, so the AUTO twin of
  # each limit is the one that moves the aircraft. Which twin is which was read
  # off the v1.17 source 2026-07-22 (a review corrected the note these comments
  # used to carry): FlightTaskAuto.hpp declares MPC_ACC_HOR and MPC_JERK_AUTO —
  # MPC_ACC_HOR lives in multicopter_autonomous_params.c — while
  # MPC_ACC_HOR_MAX belongs to FlightTaskManualPosition. So MPC_ACC_HOR below IS
  # the mission's horizontal accel cap, not a manual-only knob.
  # Ceiling for the hexa: a = g*tan(MPC_TILTMAX_AIR 30 deg) = 5.66 m/s^2, so the
  # quad's 8.0 would demand more tilt than the anti-flip cap allows.
  MPC_ACC_HOR: 3.0          # AUTO horizontal accel cap (m/s^2). 2 -> 3 on
                            # 2026-08-28 with the 5 m/s cruise (reaches it in
                            # 1.7 s; the 2026-07 validated value). KMUTNB had 3 -> 2 —
                            # legs are 10-52 m, so gentle accel costs a second
                            # per leg and buys smoother frames + less leg-end
                            # overshoot on the small field.
  MPC_ACC_HOR_MAX: 5.0      # manual position mode only (safety pilot); PX4
                            # default 5 — kept explicit so the two read alike.
  MPC_JERK_AUTO: 3.0        # AUTO jerk (m/s^3); PX4 default 4. KMUTNB: 5 -> 3,
                            # paired with the accel cap above for the
                            # accuracy-over-speed profile.
  NAV_ACC_RAD: 1.0          # waypoint acceptance radius (m) — KMUTNB: 2 -> 1.
  # The VERTICAL twin, pinned 2026-08-24 after it turned out to decide where
  # takeoff ends. PX4 leaves AUTO_TAKEOFF once it is within this of the target,
  # so the aircraft levels off at MIS_TAKEOFF_ALT - NAV_MC_ALT_RAD: commanded
  # 6.5, two real flights held at 5.72 and 5.61. It was never pinned before, so
  # a PX4 default change would have moved the takeoff gate underneath us.
  # mavlink_adapter/commands.py derives the climb-gate tolerance from this.
  NAV_MC_ALT_RAD: 0.8       # vertical acceptance radius (m); PX4 default
                            # Transit legs are only 10-20 m apart here; a 2 m
                            # radius would cut visible corners at P1/P2/P3 (the
                            # judges score each transit coordinate passed).
                            # orchestrator/mission.py _ARRIVAL_RADIUS_M (= this
                            # + 1 m) moves in step.
  # ── XY position/velocity loop: wind-rejection set for the land-ON precision
  # (G6 touchdown scatter). A/B on tools/landing_trial.py n=8 vs PX4 defaults
  # (P 0.95 / P_ACC 1.8 / I_ACC 0.4 / D_ACC 0.2): touchdown-vs-pad-centre
  # median 0.53→0.44 m, p90 0.69→0.64 m, align locks 0.03-0.15 m (was
  # 0.08-0.18), zero lost-lock/oscillation. A hotter set (1.8/4.0/1.2) bought
  # nothing more (median 0.43, worse 0.75 m tail) — this is the keeper. ──
  MPC_XY_P: 1.5             # position P — stiffer hover hold (default 0.95)
  MPC_XY_VEL_P_ACC: 3.0     # velocity P — gust response (default 1.8)
  MPC_XY_VEL_I_ACC: 0.8     # velocity I — steady-wind offset rejection (default 0.4)
  MPC_XY_VEL_D_ACC: 0.3     # velocity D — damping (default 0.2)
  # Descent = FAST high, SLOW low. This DN value is the fast CAP used during target
  # acquisition + on the high rungs; orchestrator/tactical_align.py steps it DOWN per
  # rung (≈3.0 → 1.5 → 0.8 m/s) so the drone drops quickly up high and eases off near
  # the ground, then LAND_SPEED crawls the final touchdown (no slam — the egg is
  # released only AFTER touchdown, but the airframe + pad must survive the landing).
  MPC_Z_VEL_MAX_DN: 1.5     # descent cap (m/s); KMUTNB: 3 -> 1.5 — "up high" is
                            # 4 m here, there is no altitude to spend descending
                            # fast. PX4 default 1.5.
                            # ⚠ PX4 reads this in MANUAL/offboard modes only
                            # (FlightTaskManualAccelerationSlow) — the mission flies
                            # AUTO, so MPC_Z_V_AUTO_DN below is what actually moves it.
  # THE autonomous descent speed: every AUTO descent, including the one onto the
  # pad with the egg aboard. PX4's default is 1.5; the SITL runs that validated
  # the 0.15-0.22 m release accuracy in fact flew 0.4 (a value that had persisted
  # in the sim's parameter file), so pin the validated number rather than let a
  # real 6X descend 4x faster than anything ever tested. mission.py raises it to
  # 2.5 for the L&R staged descent ONLY and hands it straight back.
  MPC_Z_V_AUTO_DN: 0.4      # AUTO descent speed (m/s); PX4 default 1.5
  MPC_Z_VEL_MAX_UP: 2.5     # cap AUTO climb speed (m/s; PX4 default 3). 1.5 -> 2.5
                            # on 2026-08-28: four 18 m climb-outs per flight at
                            # 1.5 = 48 s; at 2.5 = 29 s, overshoot ~0.6 m under a
                            # 30 m ceiling is nothing. KMUTNB note, ceiling 10:
                            # 2 -> 1.5 — climb overshoot scales ~v², and the
                            # ceiling is only 1 m above transit now, so the
                            # 2.0-tuned overshoot (~0.3 m at 20 m) must shrink
                            # with the band. Costs <1 s per 4 m climb.
  # Takeoff climbs to transit_alt - 2 m (mission.py stages the last 2 m at a
  # 1 m/s cap). Never set it above MPC_Z_VEL_MAX_UP (pinned by
  # tests/test_px4_tuning_parity.py).
  MPC_TKO_SPEED: 1.5        # takeoff climb speed (m/s); PX4 default 1.5
  MPC_LAND_SPEED: 0.3       # slow final touchdown (m/s); default 0.7 — gentle for the egg.
                            # NOT raised: a global MPC_LAND_* bump made AUTO.LAND
                            # climb to 41 m after the L&R touchdown (e02ffa3).
                            # The L&R descent is staged in mission.py instead.
  MPC_LAND_ALT1: 4.0        # start slowing the AUTO.LAND descent at 4 m AGL
                            # (KMUTNB: 10 -> 4, scaled into the 5 m band)
  MPC_LAND_ALT2: 2.0        # final crawl speed below 2 m AGL (was 5)
  # Any failsafe RTL (geofence, datalink loss, watchdog) climbs to RTL_RETURN_ALT
  # first — PX4's default 60 m would smash through the ceiling. Emergency
  # egress is a direct line home: it skips the corridor, so it crosses the
  # main building, the display aircraft and the tree line on the way.
  # ⚠ 19.5 -> 25.0 on 2026-08-28 (event briefing: ceiling 20 -> 30; operator:
  # "25 m clears everything, so fly the RTH failsafe at this level"). Under
  # the 20 m ceiling the return had to ride 0.5 m under the ceiling and only
  # 8-12 m over the roofs; 25 puts it 13+ m above every obstacle on the field
  # and still 5 m under the new ceiling — which is exactly the room PX4's
  # in-flight home.alt drift needs (measured up to +4.65 m, 2026-08-26; the
  # FC flies RTL_RETURN_ALT above ITS home, the companion measures the
  # ceiling above the LATCHED one). Do NOT raise it further: at 30 a +4.65 m
  # drift is a real 34.65 m — a rules breach in the middle of a failsafe.
  # (2026-08-22 history: 9.0 -> 19.5, review F7 — 9 was the KMUTNB number and
  # crossed the field below the rules' 10 m floor.)
  RTL_RETURN_ALT: 25.0      # failsafe return altitude (m AGL); PX4 default 60
  # FC-level ALTITUDE fence at the competition rules' 20 m (operator
  # 2026-08-18) — the outer net above the watchdog's 10 m ceiling (warn 10.5 /
  # RTH 12). Additive to the polygon fence; same GF_ACTION=3 (Return).
  # RAISED 20 -> 22 on 2026-08-24 (operator). This is the FC's OWN vertical
  # fence and GF_ACTION=3 makes it RETURN, so it is the LAST net — but at 20 it
  # fired BEFORE the companion watchdog it is supposed to back up:
  #     transit commanded 19.5 · companion warns 20.5 · companion RTHs 21.5
  #     FC fence 20.0  <- first to trigger, and the least graceful
  # At KMITL that left 0.5 m between the commanded transit and an FC-side RTL,
  # while this airframe has recorded 19.75 m against a 19.5 m command and a
  # transient near 20.5 m during egress — through the fence. 22 puts it 0.5 m
  # ABOVE the companion RTH, restoring the intended order. The rules' ceiling
  # (30 m since the 28-Aug-2026 briefing; 20 before) is still enforced by the
  # companion (warn +0.5 / RTH +1.5 over profile.altitude_ceiling_m), which is
  # the layer that can land gracefully.
  GF_MAX_VER_DIST: 50.0     # FC vertical fence (m) — gross-runaway net only: PX4 1.17
                            # rewrites home.alt in flight (#25003), so a 22 m fence
                            # RTL'd a true 8 m sweep on 2026-08-26; the companion
                            # watchdog (latched-home AGL) is the real ceiling
  # ── DOWNWARD RANGEFINDER (Benewake TFmini-S, 0.1-12 m) ──
  # The no-RTK GPS wanders ~0.5-1.5 m vertically; the rangefinder pins AGL for
  # the delivery descent and the on-pad touchdown. EKF2_RNG_CTRL is already 1 by
  # default on the 6X (confirmed by reading the board 2026-07-22) but is pinned
  # here so a param reset cannot silently drop height aiding.
  # ⚠ SENS_TFMINI_CFG (which serial port the driver opens) is deliberately NOT
  # set here — it is chosen at the G5 bench once the wiring is decided, and a
  # wrong port number would take over a port the CM4 or GPS needs.
  EKF2_RNG_CTRL: 1          # fuse the downward rangefinder
  # CONDITIONAL range aiding (RNG_CTRL=1) only fuses the rangefinder while
  # speed < EKF2_RNG_A_VMAX (1 m/s) AND altitude < EKF2_RNG_A_HMAX. PX4's
  # default HMAX is 5.0 — which is EXACTLY the competition ladder's 5 m rung
  # (tactical_align rungs 12/8/5/3/2/1.5), i.e. the enable boundary sits on the
  # altitude where the aircraft is deliberately slowed to re-centre, so the
  # height reference can flip source at the worst possible moment. Pinned to
  # 7.0: clear of every rung, still well inside the TFmini-S's trustworthy band
  # (0.1-12 m), and inside PX4's own 1..10 limit. Chosen from what the SENSOR
  # can be believed at, not merely to dodge the rung numbers.
  EKF2_RNG_A_HMAX: 7.0      # range aiding engages below this (m); PX4 default 5.0
  # Which source owns absolute height. ⚠ **1 (GPS) -> 0 (BARO) on 2026-08-23,
  # operator decision** — this file was still carrying PX4's default, i.e. the
  # setting that has already ended a flight. Measured at KMUTNB 2026-08-20 on
  # `=1`: baro-vs-GPS divergence **10.8 m peak-to-peak** in one flight, the
  # reported AGL inflating to 12.0 m while the aircraft physically held ~8.5 m,
  # and the ceiling watchdog — correct on its inputs — RTH'd an aircraft that
  # was tracking transit to 1.7 m. Flight 3 the same afternoon on `=0` flew
  # transit 3/3 at 1.4-2.0 m with no altitude event at all.
  # The earlier note left this at 1 here on the reasoning that the competition
  # ceiling is 20 m and therefore has more margin. It does not have enough:
  # transit is commanded at 19.5 m and the watchdog RTHs at 22 m, so the margin
  # is **2.5 m against a measured 10.8 m** — the same breach, on a scored
  # flight, with a 20-minute window that does not survive an RTH.
  # Baro is step-free over a <20 min flight; GPS still owns horizontal; the
  # TFmini still pins the final metres through the conditional aiding above
  # (EKF2_RNG_CTRL=1 / EKF2_RNG_A_HMAX=7.0, unchanged).
  # NOT 2 (range): that makes the local origin ride ground level, so a shed
  # cargo box or a person under the beam would move "down".
  # ⚠ reboot_required — a change applies from the NEXT boot, and PX4 stores
  # the new value immediately, so a read-back says "held" while the estimator
  # still runs on the old reference. That is why this key is deliberately NOT
  # in verify_envelope_pins (a gate that can only report success gets
  # believed). `tools/preflight_params.py` reads it as a BOOT_LATCHED STOP,
  # taking the expected value from THIS file — run it before the field day, and
  # if the board still reads 1, REBOOT the FC after the push and re-check.
  EKF2_HGT_REF: 0           # height reference = BARO (see the note above)
  # ── STATUS BEACON PATH (cm4/status_beacon.py) ──
  # MAV_1 = TELEM2 = the CM4's link. Forwarding lets the CM4's broadcast
  # STATUSTEXT cross to the radio instance so the operator sees the mission +
  # camera summary WITHOUT WiFi. Default is [true, false, false] per instance,
  # i.e. MAV_0 (the radio) already forwards and MAV_1 (this one) does not —
  # so this single key is what the beacon needs.
  # ⚠ reboot_required: PX4 applies it as a module start argument, so pushing it
  # at mission start only takes effect on the NEXT boot. Set it once at the
  # bench (QGC) too; this key just makes the aircraft self-heal after a param
  # reset. Verified in SITL by the mission_AAVC session 2026-08-15: with it at
  # 0, send_status_text SUCCEEDS and zero lines reach the other link.
  MAV_1_FORWARD: 1          # CM4 -> radio STATUSTEXT forwarding (reboot to apply)
  # Optical flow was CUT from the project on 2026-07-22 (no flow module in the
  # X6100 kit). PX4 1.17 defaults EKF2_OF_CTRL to 1, so pin it OFF: with no flow
  # sensor present the fusion never runs, but leaving it enabled invites a
  # confusing "flow timeout" health failure at arming.
  EKF2_OF_CTRL: 0           # optical flow fusion OFF — no such sensor aboard

# Camera gimbal — ❌ NOT FITTED (operator, 2026-08-16: "กล้องผมไม่ได้ติดกิมบอล").
# The OV9281 is HARD-MOUNTED looking straight down, so there is no mount servo
# to drive and nothing to stabilize; `enabled: false` stops the mission pushing
# MNT_* at a board that has no gimbal (it was best-effort, but a failed push
# still lands in the anomaly log as noise that hides real faults).
#
# ⚠ WHAT THIS MOVES ONTO THE SOFTWARE: a hard-mounted camera pitches WITH the
# body, so the attitude composition in vision/projection.py stops being a
# refinement and becomes load-bearing — a translating multirotor holds 10-15°
# and an uncompensated nadir projection drifts by ~alt*tan(tilt) (≈2 m at 12 m
# / 10°). That path is implemented and both flight call sites do pass roll/pitch
# (orchestrator/vision_worker.py, orchestrator/tactical_align.py), which is why
# losing the gimbal costs accuracy rather than correctness. It does raise the
# value of the camera FOV calibration: `cameras.nadir.fov_deg` is still a
# PLACEHOLDER, and every degree of FOV error now rides on top of the tilt term.
#
# The params are KEPT (not deleted) so re-fitting a gimbal is a one-line change
# back to `enabled: true`; every value remains a VERIFY-AT-BENCH candidate.
gimbal:
  enabled: false
  params:
    MNT_MODE_IN: 4        # int   VERIFY-AT-G5: input mode (v1.17 enum)
    # 0 = AUX (drive the PWM servo directly), 1 = MAVLink gimbal protocol v1,
    # 2 = v2. This said 1 with the comment "output to AUX/PWM" until 2026-07-22:
    # value 1 makes the mount driver talk MAVLink to a gimbal device that does
    # not exist on this aircraft, so the pitch servo is never driven and the sole
    # nadir camera pitches with the body through transit and braking.
    MNT_MODE_OUT: 0       # int   VERIFY-AT-G5: 0 = drive the AUX PWM servo
    MNT_DO_STAB: 1        # int   VERIFY-AT-G5: stabilize pitch
    MNT_RANGE_PITCH: 90.0 # float VERIFY-AT-G5: servo travel (deg) ↔ PWM range
    MNT_OFF_PITCH: 0.0    # float VERIFY-AT-G5: mechanical trim offset
    # INT32, and NOT an angle: it selects which RC AUX channel drives pitch
    # (0 = disabled, 1-6 = AUX1-6). 0 is what we want — the camera is held down
    # by stabilization, not steered by the pilot. Kept as an int so the write is
    # accepted; as 0.0 it was rejected on type and showed up as "applied 5/6".
    MNT_MAN_PITCH: 0      # int   VERIFY-AT-G5: no manual RC pitch channel

# FC-level failsafes pinned + readback-confirmed at mission start (S4). These are
# the flight controller's OWN failsafe layer — they fire even if the CM4 companion
# dies, so they do NOT depend on the software watchdog. Battery thresholds are
# FRACTIONS (0..1) and sit BELOW the companion watchdog's 15%/10% RTH/LAND (30/20 until 2026-08-27)
# (mission_brain.profile) so the companion acts first and the two never race.
# ⚠ Confirm the battery thresholds on the REAL pack's discharge curve before G7 —
# the SITL battery is nominal. Omit a key to keep the method default.
failsafes:
  # NAV_RCL_ACT=2 (Return) on RC/safety-pilot link loss; COM_RCL_EXCEPT=4 exempts
  # Offboard/Mission so the autonomous sortie isn't RTL'd for having no RC bound.
  # (Set in code, hardcoded 2/4 — mirrored here for the record; see set_rc_loss_rtl.)
  # ⚠ WHICH THRESHOLD DOES WHAT — corrected 2026-08-16 against the PX4 source.
  # These three lines used to read as though BAT_LOW_THR was where the FC acts.
  # It is not. With COM_LOW_BAT_ACT=3 PX4's own words are "Return at critical
  # level, land at emergency level" (commander_params.c), so:
  #     BAT_LOW_THR      25%  →  WARNING ONLY. The FC does not fly anywhere.
  #     BAT_CRIT_THR     15%  →  Return
  #     BAT_EMERGEN_THR   7%  →  Land where it is
  # The companion watchdog (15% RTH / 10% LAND since 2026-08-27) therefore sits above EVERY FC
  # action, not just above the low line — the layering still holds, and holds
  # by a wider margin than the old comments claimed, but do not plan against
  # "the FC returns at 25%": it does not.
  bat_low_thr: 0.25         # BAT_LOW_THR — warning only (see above); also the
                            # energy-budget reserve fraction (see `battery:`)
  bat_crit_thr: 0.15        # BAT_CRIT_THR — FC RETURNS here (= companion RTH 15% since 2026-08-27; LAND 10%)
  bat_emergen_thr: 0.07     # BAT_EMERGEN_THR — FC LANDS in place here
  low_bat_act: 3            # COM_LOW_BAT_ACT: 3 = Return at critical, Land at
                            # emergency. (1 = plain Return still works but is
                            # deprecated in v1.17 and gone from the param
                            # metadata, so QGC will not offer it.)
  # (ONE MOTOR OUT — ca_failure_mode / act_fail_act lived here until
  # 2026-08-17. Removed with the companion motor_health block: the ESCs
  # on this airframe are PWM-only with no telemetry lead, so no layer can
  # ever see a motor fail and both keys armed a detector that cannot
  # fire. Restoring it starts with buying ESCs, not with a param.)

# ── Pack + energy budget (orchestrator/energy_policy.py) ──
# The reserve is NOT declared here: it is failsafes.bat_low_thr above. One
# number, one owner.
# ⚠ CORRECTED 2026-08-16 — the reason given here used to be "below that the FC
# flies its own low-battery RTL", which is not what PX4 does: BAT_LOW_THR only
# warns, and COM_LOW_BAT_ACT=3 returns at BAT_CRIT_THR / lands at
# BAT_EMERGEN_THR. bat_low_thr is still the right single owner of the reserve —
# it is the first level anything reacts to and the companion's 15% RTH clears
# it — but it is a planning floor, not the edge of a failsafe.
# ⚠ 2026-07-25 — TWO PACKS IN PARALLEL. The aircraft now flies two of the same
# DXF 6S 7500 mAh 140C packs wired in PARALLEL: capacity adds (15,000 mAh),
# voltage does not (still 6S), so `cells` is unchanged. The second pack also
# adds 1.05 kg, taking AUW 7.17 -> 8.22 kg — and every seed below is a CURRENT
# figure, so they all had to move with the mass, not just the capacity:
# hover power scales ~W^1.5, giving (8.22/7.17)^1.5 = 1.23x, i.e. the 29 A
# hover from the EFT E5 bench table becomes ~35.6 A. Airframe side of the same
# change: sitl/models/eft_x6100_base/model.sdf (mass) and
# sitl/px4_patches/22000_gz_eft_x6100 (MPC_THR_HOVER 0.48 -> 0.53).
# ⚠ 2026-08-19 — PACK SWAP: back to ONE 6S 17000 mAh semi-solid (Perpetual
# Wings), 10C, FLYING FOR REAL (operator: "ใช้แบต 17000 บินจริง เลิกใช้ 7500
# แล้ว"). This supersedes the 2026-08-17 note below. MEASURED 2026-08-19:
# pack 1.5 kg; AUW ready-to-fly WITH 4x50 g egg payload = 7.2 kg; 6S; full
# charge 25.1 V = 4.18 V/cell. capacity_mah below is 17000.
#   ⚠ STILL OPEN, gated on the operator:
#   (1) BATTERY ENDPOINTS — operator spec 2026-08-19: 6S, full 25.1 V,
#       empty ~22.6 V => per cell BAT1_V_CHARGED 4.18, BAT1_V_EMPTY 3.77.
#       Read LIVE off the board over NOMAD the same day: it holds 4.05 / 3.60,
#       i.e. NOT this pack. Since BAT1_CAPACITY=-1 the whole gauge is
#       interpolate(cell_v, V_EMPTY, V_CHARGED); and with no current sensing PX4
#       does NOT load-compensate (calculateStateOfChargeVoltageBased only
#       compensates when current > 0), so the raw, sagging in-flight voltage is
#       read straight against these two — the numbers above are RESTED. With the
#       17000 pack a 4-delivery flight spends ~4.5 of 12.75 Ah usable and never
#       nears the 15% RTH, so these endpoints drive the OPERATOR's gauge
#       accuracy far more than any failsafe trigger. Setting them to the pack
#       (4.18 / 3.77) is safe; verify the mid-range on a test hover (sag under
#       load) if precision matters. Writing them to the FC is an operator
#       go-ahead item (failsafe param) — not pushed from this repo.
#   (2) SITL SDF mass + MPC_THR_HOVER + sim_battery below still describe the OLD
#       pack — SITL-only, not flight safety; real bird lets MPC_USE_HTE learn
#       hover. Tracked in the safety-review Workstream A.
# The seeds below are now VERY conservative against a 17000 pack (usable
# 12750 mAh vs a 4450 mAh seed-flight) — i.e. the GO gate errs STRICT. Kept as
# a floor until a real 17000 flight's measured consumed-mAh replaces them.
#
# ── superseded history ──
# ⚠ 2026-08-17 — PACK SWAP: back to ONE 7500 mAh 6S (operator: "เกจแบต ตอนนี้
# เปลี่ยนเป็น 7500 ก่อนครับ"). This supersedes the 2026-08-14 note below it.
# History: 2x7500 in parallel (15000, the AUW-8.22 kg aircraft every validated
# G4/G4' run flew) -> 1x17000 Perpetual Wings semi-solid on 2026-08-14 -> ONE
# 7500 now. Note this is HALF the validated pair, not the pair.
#
# ⚠ WEIGHED 2026-08-17 (operator: "ชั่งแล้วครับ 7 โล ใช้แบต 7500"):
# **7.0 kg on the scale, aircraft as it stands with ONE 7500 pack fitted, no
# eggs.** That is a measurement and it outranks every calculated figure below
# it — including this repo's own BOM sum (7.17 kg) and the 8.00 kg a parallel
# session held from a 2026-08-14 weighing. The three disagreed for a whole
# afternoon because each recorded a NUMBER without recording WHAT WAS ON THE
# AIRCRAFT: 2026-08-14 predates the CM4 (fitted 08-15) and the PM03D removal
# (08-16), so it was a different machine. RULE FROM THAT: never write a mass
# without the aircraft state beside it — pack count, PM03D in/out, CM4 in/out,
# eggs in/out.
#
# Flying mass = 7.0 + 4 x 90 g of egg boxes = 7.36 kg. Hover follows this file's
# own mass^1.5 rule from the 8.22 kg / 35.6 A anchor: 35.6 x (7.36/8.22)^1.5 =
# ~30.1 A, which is within 2 % of the 29.6 A the seeds below were derived at, so
# the weighing CONFIRMS them rather than moving them. (The rule reproduces the
# 43 A the 17000-pack note recorded, so it is the same arithmetic, not a new
# guess.)
#
# Endurance: 5625 mAh usable / 30.1 A = ~11.2 min to the reserve, against the
# 7.6 min (457 s) the four-delivery G4' flight actually took. A four-delivery
# flight budgets 4700 mAh of 5625 — roughly 900 mAh of slack, which is real
# margin rather than the 25 mAh deficit an 8.0 kg aircraft would have had.
# ⚠ NOT changed here, on purpose: the SITL model mass (8.169 kg) and
# MPC_THR_HOVER still describe the 2-pack aircraft, and they are shared with the
# parallel session's repo. They move together, deliberately, not as a side
# effect of this note.
battery:
  capacity_mah: 17000       # ONE 6S 17000 mAh semi-solid (Perpetual Wings), 10C
  cells: 6
  # ~29.6 A hover x 3.5 min. Used ONLY for flight 1; measurement replaces it
  # from flight 2 onwards.
  seed_sortie_mah: 1750
  # Marginal cost of each EXTRA delivery in the SAME flight (~110 s at ~29.6 A).
  seed_delivery_mah: 900
  # DELIBERATELY NOT scaled down with the cost it guards (the 17000 note scaled
  # it up x1.22 for exactly that reason). This estimate rests on a pack mass
  # nobody has weighed, so the slack matters more now, not less — and there is
  # room for it: a four-delivery flight budgets 1750 + 3x900 + 250 = 4700 mAh
  # against 5625 usable.
  margin_mah: 250

# ── SITL ONLY — PX4's battery simulator ──
# Without this the simulated pack never drains (measured 2026-07-22: 100 % and
# 16.2 V flat through a whole flight, and BATTERY_STATUS reporting -383 mAh
# consumed), so none of the energy logic can be exercised before real hardware.
# These params do not exist on the real board. They are applied on a SEPARATE
# path from px4_tuning and must never be merged into it.
sim_battery:
  SIM_BAT_ENABLE: 1
  # Seconds full -> empty at hover draw: 7500 mAh / ~29.6 A x 3600 = ~912 s.
  # (2026-08-17 pack swap back to ONE 7500. NOTE this is now SHORTER than the
  # 20-minute operation window, which is the point: the sim will actually reach
  # the reserve inside a long run, so the energy gate gets exercised instead of
  # idling behind a pack that never empties.)
  SIM_BAT_DRAIN: 900.0      # ~15 min full -> empty at hover
  SIM_BAT_MIN_PCT: 0.0      # the default 50 stops the drain half way
  # ── Pack + power sensing ──
  # ⚠ REWIRED 2026-08-16 (operator): the Holybro PM03D FAILED and is OUT.
  # Since 2026-08-20 a Holybro PM02D feeds the Pixhawk (replacing the interim
  # converter) — but it powers the FC/avionics ONLY; the MOTORS are still fed
  # by a SEPARATE board that the FC does not sense. The PM02D gives the FC a
  # clean voltage reading and a ~0.7 A avionics current — that current is the
  # TRAP, not a feature: see below.
  #
  # The consequence is not "one less sensor", it is that any current the FC
  # still measures is the AVIONICS draw (well under an amp), NOT the ~35-43 A
  # the aircraft actually burns. A current-integrating fuel gauge fed that
  # signal reads a pack that never empties — the most dangerous possible
  # failure here, because it fails OPTIMISTIC and silently: every GO gate and
  # every RTH-on-battery decision would be made against a full-looking pack
  # while the real one runs flat mid-delivery.
  #
  #   ⇒ At the bench, set:
  #       BAT1_CAPACITY = -1
  #     (flagged reboot_required, but `battery.cpp` param_get's it and calls
  #      setCapacityMah() on every param update, so it applies live. Verified
  #      2026-08-16 — do not assume the flag means boot-only, it varies per
  #      module: FD_ACT_EN is live too, MAV_1_FORWARD genuinely is not.)
  #
  #     ⚠ CORRECTION 2026-08-16: this block first said `BAT1_I_CHANNEL = -1`.
  #     That is a NO-OP — src/modules/battery_status/module.yaml documents -1 as
  #     "use the board default" AND ships `default: [-1, -1]`, so writing it
  #     changes nothing (verified in the v1.17 worktree; caught by the parallel
  #     session before it was set on the aircraft).
  #
  #     CAPACITY is the real switch, in lib/battery/battery.cpp
  #     `estimateStateOfCharge()`:
  #         if ((_capacity_mah > 0.f) && _battery_initialized) {
  #             weight_v = 3e-2f * (1 - soc_volt_based);   // ~0 on a full pack
  #             soc -= _discharged_mah_loop / _capacity_mah;   // ~0, no current
  #             soc = min(1 - _discharged_mah/_capacity_mah, soc);
  #         } else {
  #             soc = _state_of_charge_volt_based;         // <- the path we want
  #         }
  #     With a positive capacity and no current, the gauge is pinned near 100%
  #     for the whole flight. Only capacity <= 0 reaches the voltage branch.
  #     PX4 then reports no consumed-mAh either, so orchestrator/energy_policy.py's
  #     `energy_consumed_mah` also drops to its VOLTAGE path ("B", capacity x
  #     (1 - percent/100)) and every budget downstream stays honest — existing,
  #     tested code; what it needed was PX4 to stop publishing a number that
  #     looks valid and is not.
  #
  # VOLTAGE is now the ONLY input to the gauge, so these stop being trim and
  # become the whole measurement. They are THREE separate questions, and
  # answering one does not answer the others:
  #
  #   BAT1_V_DIV      ⚠ REOPENED 2026-08-20: the 2026-08-16 multimeter-vs-GCS
  #                   closure was measured on the CONVERTER wiring, and the
  #                   divider is a property of the module — the PM02D that
  #                   replaced it needs its own check. Softener: three real
  #                   flights flew on the PM02D that night with plausible
  #                   voltages, so this is a re-verify, not a suspected fault.
  #                   One multimeter-vs-GCS reading on the PM02D closes it.
  #   BAT1_N_CELLS  = 6
  #   BAT1_V_EMPTY  = 3.77     BAT1_V_CHARGED = 4.18
  #                   (17000 semi-solid endpoints, on the board since
  #                   2026-08-19 — full 25.1 V, empty ~22.6 V per the
  #                   operator's spec; the stale LiPo-era 3.50/4.15 that used
  #                   to sit on this line never matched the board.)
  #                   A correct VOLTAGE and a correct PERCENTAGE are different
  #                   claims: these two are the endpoints the whole percentage
  #                   is interpolated between (`math::interpolate(cell_v,
  #                   v_empty, v_charged, 0, 1)`), so a right voltage still
  #                   reports a wrong % if they are wrong — and every
  #                   threshold in this file is a % of that.
  #
  # ⚠ And because the gauge has no load compensation without current
  # (`calculateStateOfChargeVoltageBased` only corrects when current > 0), the
  # reading SAGS whenever the motors pull and springs back. orchestrator/
  # safety.py therefore requires both battery thresholds to hold for
  # `battery_sustain_s` before acting — a single dip must not land the aircraft
  # in the middle of the field.
  # These are NOT pushed from here: BAT1_* are calibration values that belong to
  # the airframe, and writing a wrong divider over MAVLink would corrupt a good
  # calibration. Set them ONCE in QGC → Power and leave them.
  #
  # Until that is done the board reports BAT1_* unset (SOURCE=-1, N_CELLS=0) and
  # battery percentage is MEANINGLESS — and the thresholds above are percentages
  # OF that calibration. Re-confirm against the real pack's discharge curve
  # before the first field mission.

# Pre-flight readiness gate thresholds (orchestrator.preflight). The mission holds
# in a PREFLIGHT phase before EVERY sortie until the operator GOs on the dashboard
# (entering the committee-assigned marker ID) / criticals pass (headless).
preflight:
  # Hard floor only: at or below this the FC flies its OWN low-battery RTL
  # (failsafes.bat_low_thr), so launching would be taking off into a failsafe —
  # not an operator judgment call, hence a critical row with no force escape.
  # Everything ABOVE it is the energy budget's call (orchestrator/energy_policy.py):
  # it knows what a sortie actually costs, refuses when the pack cannot cover
  # one, and CAN be forced. This was 50 %, which made the 50→25 % band
  # unreachable — the gate the budget exists to open was nailed shut by a
  # threshold that predates it, and un-forceably so.
  battery_pct: 25.0         # = failsafes.bat_low_thr (critical, cannot be forced)
  gps_sats: 6               # minimum satellites (coarse, no-RTK) (critical)
  camera_max_age_s: 5.0     # nadir frame must be fresher than this (critical)
  # How long the headless gate waits for the criticals before giving a flight
  # up. Between flights this IS the battery-swap window: the FC reboots on the
  # new pack and needs link + GPS lock + EKF + home again — a cold GPS lock
  # alone can take 1-3 min, and the old hard-coded 120 s (main.py default)
  # would have ended the mission with the recovery flight still owed. 420 s =
  # the most a swap can be worth: the known-sortie gate needs ~430 s of window
  # left anyway, so a swap that takes longer has no flight to feed
  # (2026-08-27 bench review). Operator can ⏹ earlier at any time.
  gate_timeout_s: 420.0

# ── land-ON descent loop (orchestrator/tactical_align.py AlignParams) ──
# Matched to the PRACTICE config 2026-08-26. These equal the dataclass
# defaults today; they are written out so the competition field never
# silently inherits a future default change the practice field did not fly.
align:
  cycle_hz: 12.0          # achieved rate (deadline-paced); ~60 ms of work per
                          # cycle on the CM4 leaves ~38% headroom under it
  lock_cycles: 9          # 0.75 s of in-tolerance before descending a rung
  rung_alt_tol_m: 0.3     # ALTITUDE GATE (2026-08-28): a rung is "reached" only
  rung_alt_tol_frac: 0.12 # within max(0.3 m, 12 %) of its altitude — from the
                          # marker's apparent size. The KMITL 17:28 flight locked
                          # every rung in 1-2 s while still at 5-9 m and handed
                          # PX4 LAND a 16-26 s blind descent → 0.5-0.7 m off.
  max_lost_cycles: 24     # 2.0 s of lost pad before climbing back
  median_window: 3        # fixes fused per command (lag = window / cycle_hz
                          # = 0.25 s; keep ODD and small — see the dataclass)
