# Payload-release servos — the manual "ปล่อย servo" buttons on the GCS.
# IDENTICAL to the practice field file: FOUR independent latch servos, outputs
# are ACTUATOR-SET indices 1..4 (MAV_CMD_DO_SET_ACTUATOR param1..4 / PX4
# output function "Peripheral via Actuator Set 1..4" — PX4 has no
# DO_SET_SERVO handler, so the GCS's _servo_send speaks DO_SET_ACTUATOR).
# PWM semantics: the GCS normalizes (pwm-1500)/500 -> 1900 = +0.8 release,
# 1100 = -0.8 hold — the same +0.8 the mission's own release flies
# (2026-08-27 ULog: AUX4 1900 / AUX1 1990 on the real latches, both eggs
# out) and the value the practice console has re-latched with all week.
payload_servos:
  # actuator-set index == the REAL AUX pin the servo plugs into (PWM_AUX_FUNCn
  # = 300+n) — so button N drives AUX N. AS-WIRED 2026-08-15, "top" = nose end:
  #   AUX 1 = rear-right | AUX 2 = front-right | AUX 3 = rear-left | AUX 4 = front-left
  # NOTE the buttons are per-PIN, NOT per-egg: the mission's delivery order
  # 0..3 maps through connection.drop_servo_channels = [4, 1, 2, 3]
  # (sitl/kmitl_config.yaml), i.e. the FIRST egg released is AUX 4. Full table:
  # docs/SERVO_AUX_MAPPING.md.
  outputs: [1, 2, 3, 4]   # actuator-set index = AUX pin (one button per latch)
  released_us: 1900       # -> +0.8: opens the latch (drops the payload)
  held_us: 1100           # -> -0.8: holds it shut (reset, ready to reload)
