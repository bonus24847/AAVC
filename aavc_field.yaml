# AAVC 2026 competition field (IAAI KMITL, Lat Krabang) — field file for the
# AAVC GCS console (~/Desktop/aavc-gcs/src/aavc_gcs.py), i.e. the AAVCGCS-COMP
# icon (missions.yaml entry `aavc`):
#
#   python3 ~/Desktop/aavc-gcs/src/aavc_gcs.py --field aavc_field.yaml
#
# STRUCTURE + every non-geometry value mirror the practice field file
# (mission repo gcs/kmutnb_field.yaml) on purpose — operator 2026-08-27:
# "ปรับให้เหมือนกัน ต่างแค่สนามแข่ง, path ที่ต้องบิน". The console has only
# ever been flown from the PRACTICE icon; the competition icon must behave
# identically, so the ONLY things allowed to differ here are the coordinates.
#
# EVERY geo number below is copied from the rules PDF
# (AAVC2026_RulesAndRegulation_V1.3, p.2 airspace + search area, p.4 Table 1
# transit route) and is digit-for-digit the same set the flight config
# sitl/kmitl_config.yaml flies. NOT ground-surveyed — verify at the 28-Aug
# trial. Corner order is NW,NE,SE,SW (a simple rectangle, the order
# kmitl_config.yaml uses); the PDF lists corner PAIRS (NW,NE,SW,SE), which
# read literally is a bowtie. The console angle-sorts vertices about the
# centroid anyway (load_zones), so the map is safe either way.
#
# ⚠ NO-FLY ZONE: KMITL has one (rules Figure 1/3 — the orange block on the
# EAST side, south of the search area's east end) but the PDF gives it as a
# picture only, no coordinates, and this console has no no-fly overlay.
# Ask the committee for its vertices at the briefing.

geofence:
  # Controlled airspace boundary — [lat, lon]. Leaving it = disqualification
  # (rules p.13: "Leaving the operation airspace ... is strictly prohibited").
  controlled_airspace:
    - [13.731312, 100.787175]   # NW
    - [13.731359, 100.789916]   # NE
    - [13.729994, 100.789841]   # SE
    - [13.729806, 100.787228]   # SW
  # Search area (pads live here) — [lat, lon]. Northern strip, ~227 x 78 m.
  search_area:
    - [13.731239, 100.787824]   # NW
    - [13.731359, 100.789916]   # NE
    - [13.730703, 100.789776]   # SE
    - [13.730723, 100.787840]   # SW
  # Local ENU origin = the Launch & Recovery point = transit P1 (rules Table 1:
  # "RTH / holding point"; kmitl_config.yaml site.center ==
  # ground_operation.launch_recovery == this). The mission's local-frame
  # detected pads convert to lat/lon about here on the map. The physical L&R
  # pad (rules Figure 2, red block) sits just west of P1 — same point at map
  # scale.
  local_origin: [13.730322, 100.787446]

# Default pads to service (operator overrides live in the GCS UI). AAVC:
# choose any subset of the 6 ArUco pads (dictionary 4x4, IDs 0-6 — the rules
# figure's third marker decodes as id 0).
aruco_assignment: [1, 2, 3, 4]

# Mandatory transit route P1->P2->P3 (map overlay reference) — rules p.4
# Table 1, scored per coordinate in order BOTH ways. P1 doubles as the RTH /
# holding point; P3 is the search-area ingress/egress gate.
# ⚠ CHANGED AT THE 28-Aug-2026 EVENT BRIEFING: the north leg moved WEST, off
# the main building (now a no-fly band) — due north at E 123.7 m from L&R,
# the line the operator drew on the gridded satellite map at noon. P2'/P3'
# below are digit-for-digit the flight config's (aavc-comp
# sitl/kmitl_config.yaml transit_route); if the committee published
# coordinates, put THOSE in both files. Superseded PDF values:
#   P2 [13.730397, 100.788694] · P3 [13.730712, 100.788755]
transit_waypoints:
  - {id: 1, lat: 13.730322, lon: 100.787446}   # P1 — launch / RTH hold (unchanged)
  - {id: 2, lat: 13.730390, lon: 100.788590}   # P2' — turn north (E 123.7 / N 7.6 m; 11.3 m W of the PDF's P2)
  - {id: 3, lat: 13.730715, lon: 100.788590}   # P3' — search-area ingress/egress (E 123.7 / N 43.8 m)

