# AAVC 2026 competition field (KMITL) — GPS zones + pad defaults for aavc_gcs.py.
#
# Self-contained so the console runs standalone (on GitHub); override with
#   python3 src/aavc_gcs.py --field /path/to/other_field.yaml
# GPS values copied from touch_and_go_for_race/config.yaml (geofence block).

geofence:
  # Controlled airspace boundary — [lat, lon]. Leaving it = disqualification.
  controlled_airspace:
    - [13.731312, 100.787175]
    - [13.731359, 100.789916]
    - [13.729806, 100.787228]
    - [13.729994, 100.789841]
  # Search area (pads live here) — [lat, lon]
  search_area:
    - [13.731239, 100.787824]
    - [13.731359, 100.789916]
    - [13.730723, 100.787840]
    - [13.730703, 100.789776]
  # Local NED origin = transit P1 (launch / RTH). local (0,0) = this point, so the
  # mission's local-frame detected pads convert to lat/lon about here on the map.
  local_origin: [13.730322, 100.787446]

# Default pads to service (operator overrides live in the GCS UI). AAVC: choose any
# subset of the 6 ArUco pads (dictionary 4x4, IDs 1-6) — not capped at 4.
aruco_assignment: [1, 2, 3, 4]

# Mandatory transit route P1->P2->P3 (reference, for a future map overlay).
transit_waypoints:
  - {id: 1, lat: 13.730322, lon: 100.787446}   # launch / RTH / hold
  - {id: 2, lat: 13.730397, lon: 100.788694}   # intermediate
  - {id: 3, lat: 13.730712, lon: 100.788755}   # search-area ingress/egress

# Payload-release servos — the manual "ปล่อย servo" buttons on the GCS. The console
# sends MAV_CMD_DO_SET_SERVO(output, pwm) per servo (one click = one servo, or the
# "ปล่อยทั้งหมด" button = all). RC-only flight is unchanged; this is the only actuator
# command the GCS sends, and it is gated behind picking the drop pads first.
# ⚠️ SET THE REAL VALUES once you can read the Pixhawk 6X output config: which AUX
# outputs the 4 payload servos are wired to, and the PWM that opens (released) vs
# holds (held) each latch. Defaults below are placeholders (AUX1-4, 2000/1000 us).
# 2026-08-12 (mission_AAVC): PX4 ไม่มี handler ของ DO_SET_SERVO — GCS ส่ง
# DO_SET_ACTUATOR แทน โดยเลข output = AUX channel 9..12 → actuator-set index
# (num-8) → output function 301..304 (= PWM_AUX_FUNC1..4 บน Pixhawk 6X จริง,
# SIM_GZ_SV_FUNC1..4 ใน SITL). Real HW: PWM_AUX_MIN 1000 / PWM_AUX_MAX 2000
# ทำให้ค่า actuator +0.8/-0.8 = 1900/1100 us พอดี.
# 2026-08-15: การต่อสายจริงบนแท่น ("บน" = ด้านใกล้หัวโดรน) —
#   AUX1 = ท้าย-ขวา | AUX2 = หน้า-ขวา | AUX3 = ท้าย-ซ้าย | AUX4 = หน้า-ซ้าย
# ปุ่มในหน้า GCS = "เลข AUX pin" (ไม่ใช่ลำดับไข่) จึงเรียง 1..4 ตามพินตรงๆ
# ลำดับปล่อยของ mission (FL→RR→FR→RL) อยู่ที่ mission_AAVC/config.yaml
# delivery.servo.channels: [4, 1, 2, 3] — ฝั่ง GCS ไม่ต้องรู้
payload_servos:
  outputs: [1, 2, 3, 4]     # = actuator-set index 1..4 (func 301..304) = AUX pin
  labels:                   # ป้ายบนปุ่ม — "มุมไหนของโดรน" ไม่ใช่ "ไข่ใบที่เท่าไร"
    1: "ท้าย-ขวา"
    2: "หน้า-ขวา"
    3: "ท้าย-ซ้าย"
    4: "หน้า-ซ้าย"
  released_us: 2000         # PWM that RELEASES the latch (drops the payload) → +1.0
                            # 2026-08-15: 1900 (+0.8) เปิดไม่สุดบนสลักจริง —
                            # PX4 map ค่า −1..+1 ลง [PWM_AUX_MIN, PWM_AUX_MAX]
                            # = [1000, 2000] ดังนั้น +0.8 ได้แค่ 1900 µs
  held_us: 1100             # PWM that HOLDS it shut (reset) → -0.8
