# AAVC 2026 — mavlink-router config for HITL (real Pixhawk 6X).
#
# Fans the 6X mission link out to the orchestrator + the synthetic camera (+ an
# optional ground QGC). Run:  mavlink-routerd -c sitl/hitl_router.conf
#
# Topology (A) CM4-in-the-loop: this router runs ON THE CM4 and owns TELEM2
#   (/dev/ttyAMA0). jMAVSim owns the 6X USB HIL link SEPARATELY on the laptop — it
#   is NOT in this file.
# Topology (B) single-PC bench: set Device=/dev/ttyACM0 and UNCOMMENT the [sim]
#   endpoint below, then run jMAVSim in UDP mode (jmavsim_run.sh -q -u).
#
# See docs/HITL.md for the full runbook.

[General]
TcpServerPort = 0

[UartEndpoint fc]
# CM4 TELEM2 UART (topology A). Bench (topology B): /dev/ttyACM0 (6X USB CDC).
Device = /dev/ttyAMA0
Baud = 921600

[UdpEndpoint offboard]
# orchestrator — MAVSDK udpin://0.0.0.0:14540
Mode = Normal
Address = 127.0.0.1
Port = 14540

[UdpEndpoint hitlcam]
# hitl_synthetic_camera telemetry feed (reads GLOBAL_POSITION_INT)
Mode = Normal
Address = 127.0.0.1
Port = 14541

[UdpEndpoint raw]
# Dashboard ESC/servo/consumed-mAh listener (orchestrator RawMavlinkSubscriber).
# Set connection.raw_telemetry_port=14551 in the config to enable it.
Mode = Normal
Address = 127.0.0.1
Port = 14551

[UdpEndpoint qgc]
# Optional ground QGC. S6: default LOOPBACK — an unauthenticated MAVLink control
# plane on 0.0.0.0 lets any field LAN/Wi-Fi host command the armed aircraft. To
# use a ground QGC, set this to the CM4's LAN IP (preferred) or 0.0.0.0 — a
# deliberate opt-in, not the default.
Mode = Server
Address = 127.0.0.1
Port = 14550

# [UdpEndpoint sim]
# # ── UNCOMMENT for topology (B) single-PC bench: jMAVSim UDP HIL link ──
# Mode = Normal
# Address = 127.0.0.1
# Port = 4560
