<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 256 256">
  <defs>
    <linearGradient id="gc" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e53935"/>
      <stop offset="1" stop-color="#b71c1c"/>
    </linearGradient>
  </defs>
  <rect x="8" y="8" width="240" height="240" rx="44" fill="url(#gc)"/>
  <!-- trophy: competition = the KMITL scored event -->
  <g transform="translate(128,96)" fill="#ffd54f" stroke="#8d6e00" stroke-width="4">
    <!-- cup bowl -->
    <path d="M -44,-44 L 44,-44 L 40,-2 Q 40,34 0,34 Q -40,34 -40,-2 Z"/>
    <!-- handles -->
    <path d="M -44,-40 Q -78,-38 -70,0 Q -66,20 -44,14" fill="none" stroke-width="9"/>
    <path d="M 44,-40 Q 78,-38 70,0 Q 66,20 44,14" fill="none" stroke-width="9"/>
    <!-- stem + base -->
    <rect x="-9" y="34" width="18" height="24"/>
    <rect x="-34" y="58" width="68" height="16" rx="4"/>
    <!-- star on the cup -->
    <polygon points="0,-32 7,-14 26,-14 11,-3 16,15 0,4 -16,15 -11,-3 -26,-14 -7,-14"
             fill="#b71c1c" stroke="none"/>
  </g>
  <text x="128" y="205" text-anchor="middle" font-family="sans-serif"
        font-size="42" font-weight="bold" fill="#ffffff">แข่ง</text>
  <text x="128" y="235" text-anchor="middle" font-family="sans-serif"
        font-size="22" font-weight="bold" fill="#ffcdd2" letter-spacing="3">KMITL</text>
</svg>
