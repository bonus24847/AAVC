# KMUTNB sky-field practice map (สนามฟุตบอลลอยฟ้า มจพ. บางซื่อ) — field file
# for the AAVC GCS console (~/Desktop/aavc-gcs/src/aavc_gcs.py):
#
#   python3 ~/Desktop/aavc-gcs/src/aavc_gcs.py --field gcs/kmutnb_field.yaml
#
# (also wired as `make aavc-gcs` in this repo's Makefile.)
#
# EVERY geo number here is GENERATED by tools/gen_geo.py — the same source
# that feeds sitl/aavc_config.yaml, the world file, PX4_HOME_* and
# spawn_targets. Regenerate there, paste here; never hand-derive.
# The pitch long axis bears 143.2 deg true, so both quads below are rotated
# rectangles on the map (113.0 x 85.9 m airspace = surveyed extent + 5 m
# practice offset all around, 99.9 x 61.4 m search area).

geofence:
  # Controlled airspace boundary — [lat, lon]. Leaving it = disqualification.
  # (Vertex order preserved from aavc_config.yaml controlled_airspace, CCW.)
  controlled_airspace:
    - [13.8228177, 100.5114920]   # track side, L&R end
    - [13.8219999, 100.5121181]   # track side, far end
    - [13.8224643, 100.5127535]   # far corner of the grass
    - [13.8232822, 100.5121274]   # near corner of the grass
  # Search area (pads live here) — [lat, lon]
  search_area:
    - [13.8228640, 100.5116806]
    - [13.8221410, 100.5122341]
    - [13.8224735, 100.5126889]
    - [13.8231965, 100.5121353]
  # Local ENU origin = the Launch & Recovery point (world origin / PX4 home /
  # aavc_config site.center). The mission's local-frame detected pads convert
  # to lat/lon about here on the map.
  local_origin: [13.8228032, 100.5116267]

# Default pads to service (operator overrides live in the GCS UI). AAVC:
# choose any subset of the 6 ArUco pads (dictionary 4x4, IDs 1-6).
aruco_assignment: [1, 2, 3, 4]

# Mandatory transit route P1->P2->P3 (map overlay reference).
transit_waypoints:
  - {id: 1, lat: 13.8224803, lon: 100.5118659}   # P1 surveyed — RTH hold
  - {id: 2, lat: 13.8225125, lon: 100.5119578}   # P2 surveyed — field entrance
  - {id: 3, lat: 13.8225828, lon: 100.5120772}   # P3 derived — inside the grass

# Payload-release servos — the manual "ปล่อย servo" buttons on the GCS.
# KMUTNB rig (user spec 2026-08-11): FOUR independent latch servos in a
# rectangle at (±0.10, ±0.035) m about the CG. outputs are ACTUATOR-SET
# indices 1..4 (MAV_CMD_DO_SET_ACTUATOR param1..4 / PX4 output function
# "Peripheral via Actuator Set 1..4" — PX4 has no DO_SET_SERVO handler, so
# the GCS's _servo_send speaks DO_SET_ACTUATOR; num 1..6 passes through
# as-is). PWM semantics: the GCS normalizes (pwm-1500)/500 -> 1900 = +0.8
# release, 1100 = -0.8 hold — matching aavc_config.yaml connection block and
# the SITL airframe's SIM_GZ_SV_FUNC1..4 mapping, where
# sitl/payload_detach_bridge.py --servo turns each release into the visible
# cargo drop.
payload_servos:
  # actuator-set index == the REAL AUX pin the servo plugs into (PWM_AUX_FUNCn
  # = 300+n) — so button N drives AUX N. AS-WIRED 2026-08-15, "top" = nose end:
  #   AUX 1 = rear-right | AUX 2 = front-right | AUX 3 = rear-left | AUX 4 = front-left
  # NOTE the buttons are per-PIN, NOT per-egg: the mission's delivery order
  # 0..3 maps through connection.drop_servo_channels = [4, 1, 2, 3]
  # (sitl/aavc_config.yaml), i.e. the FIRST egg released is AUX 4. Full table:
  # docs/SERVO_AUX_MAPPING.md.
  outputs: [1, 2, 3, 4]   # actuator-set index = AUX pin (one button per latch)
  released_us: 1900       # -> +0.8: opens the latch (drops the payload)
  held_us: 1100           # -> -0.8: holds it shut (reset, ready to reload)
