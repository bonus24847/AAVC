# AAVC GCS — mission registry (2026-08-13): ตัวสลับ mission บนหน้า console
# (dropdown ในการ์ด Mission) แต่ละ entry เปลี่ยน แผนที่สนาม (field) +
# โฟลเดอร์ผล (captures) + คำสั่งปุ่ม 🚀 (mission_cmd, {ids} = pad ที่เลือก)
# entry ที่ field/mission_cmd ยังว่าง = ขึ้นในรายการแบบกดไม่ได้ (รอ contract)
#
# บล็อก `real:` = ข้อมูลฝั่งเครื่องจริง ใช้โดยไอคอน "AAVC GCS เครื่องจริง"
# (mission/cm4/launch_gcs_real_gui.sh): repo บนโน้ตบุ๊กที่จะ deploy, ชื่อโฟลเดอร์บน
# CM4, และคำสั่งที่ปุ่ม 🚀 จะ ssh ไปเรียก — ผู้ใช้ไม่ต้องพิมพ์อะไรเอง
#
# ⚠ {repo} = รากของ repo นี้ (โฟลเดอร์ที่มี gcs/ mission/ aruco/ อยู่ข้างใน)
#   aavc_gcs.py แทนค่าให้ตอนโหลด (_expand_registry) — 2026-09-02 เปลี่ยนมาจาก
#   absolute path ที่ผูกกับ ~/Desktop ของโน้ตบุ๊กเครื่องเดียว ซึ่งทำให้เครื่องอื่น
#   เปิด console แล้วได้แผนที่ว่างกับปุ่ม 🚀 ที่ชี้ไปที่ไม่มีอยู่จริง
#
# ⚠ ทุก mission_cmd ระบุ AAVC_PROFILE/AAVC_CONFIG มาเองแบบชัด ๆ (2026-09-02)
#   เดิม entry สนามแข่งกับบางบ่อชี้ไป repo aavc-comp แล้วอาศัย .aavc_site ของ
#   repo นั้นเลือกสนามให้ พอ repo รวมเป็นอันเดียว .aavc_site ที่เหลือคือของ
#   **สนามซ้อม** (kmutnb_skyfield + aavc_config.yaml) ⇒ ถ้าไม่ระบุ env
#   ปุ่ม 🚀 สนามแข่งจะบินด้วยเพดานสนามซ้อมแบบเงียบ ๆ ซึ่งคือการผิดกติกา
#   run_mission.sh อ่านเป็น "${VAR:-default}" ⇒ env ที่ส่งมาชนะ .aavc_site เสมอ
missions:
  kmutnb:
    label: "KMUTNB สนามซ้อม (เพดาน 10 m)"
    field: "{repo}/mission/gcs/kmutnb_field.yaml"
    captures: "{repo}/mission/captures"
    mission_cmd: "env AAVC_PROFILE=kmutnb_skyfield AAVC_CONFIG=sitl/aavc_config.yaml '{repo}/mission/sitl/run_mission.sh' {ids}"
    mission_label: ""   # operator 2026-08-14: ปุ่มเดียวใช้ทุกโลก ไม่ติดป้าย SIM
    reset_cmd: "env KEEP_CONSOLE=1 GUI=1 bash '{repo}/mission/sitl/launch_stack.sh'"
    real:
      repo: "{repo}/mission"
      dir: "mission"
      # ⚠ env ต้องระบุให้ครบตั้งแต่ 2026-08-25 — เดิมบรรทัดนี้ปล่อยว่างแล้วพึ่ง
      # .aavc_site บนโดรน แต่ตอนนี้ค่าเริ่มต้นของโดรนถูกย้ายไป **สนามแข่ง KMITL**
      # (operator: "ให้ default เป็นสนามแข่ง") เพราะการพิมพ์ run_mission.sh เอง
      # มือเปล่าที่ KMITL แล้วได้เพดานสนามซ้อม 10 m คือการผิดกติกาแบบเงียบ ๆ
      # ⇒ ไอคอนซ้อมจึงต้องส่งสนามซ้อมมาทับเอง ไม่ใช่ "ไม่ส่งอะไรแล้วหวังว่าจะถูก"
      entry: "REAL=1 AAVC_PROFILE=kmutnb_skyfield AAVC_CONFIG=sitl/aavc_config.yaml ~/mission/sitl/run_mission.sh {ids}"
  aavc:
    label: "AAVC สนามแข่ง KMITL (เพดาน 30 m — briefing 28 ส.ค.)"
    # REDIRECTED 2026-08-19 to the aavc-comp repo (a clone of the practice repo
    # reconfigured for KMITL via .aavc_site: AAVC_PROFILE=competition +
    # sitl/kmitl_config.yaml). The old mission_AAVC repo was retired the same day.
    # The flight core is identical to the practice repo and kept so via
    # aavc-practice/sync_core.sh.
    # 2026-09-02: the three repos became one, aavc-comp is an archive branch, and
    # this entry points at mission/ — the same flight core, with the competition
    # field carried on the command line where it can be read.
    # kmitl_config.yaml geometry is the operator's 30-Aug satellite redraw.
    field: "{repo}/gcs/aavc_field.yaml"
    captures: "{repo}/mission/captures"
    mission_cmd: "env AAVC_PROFILE=competition AAVC_CONFIG=sitl/kmitl_config.yaml '{repo}/mission/sitl/run_mission.sh' {ids}"
    mission_label: ""
    real:
      # ⚠ 2026-08-25: this block pointed at ~/aavc-comp on the CM4 and THERE IS NO
      # SUCH DIRECTORY THERE — the drone carries ~/mission (this practice clone,
      # deployed) and ~/mission_AAVC (retired). Both the 🚀 button and the
      # console's auto-infra ssh'd into it and got rc=127 every time, so the
      # competition field could not be flown from this icon at all. The failure
      # also repeated into the console's 40-line message feed every 4 s until it
      # had evicted every other line — which is how a dead radio link went 20
      # minutes with "no signal" as the only thing on screen.
      #
      # Fixed by pointing at the repo that IS on the drone rather than deploying
      # a second one, and that costs NOTHING: the two repos were verified
      # byte-identical the same day across orchestrator/ mission_brain/
      # mavlink_adapter/ vision/, sitl/run_mission.sh and cm4/start_infra.sh, and
      # ~/mission on the drone already carries sitl/kmitl_config.yaml with the
      # md5 the laptop has (1623e49a6466…). The ONLY file that differs between
      # the repos is .aavc_site — and run_mission.sh reads it as
      # "${AAVC_PROFILE:-…}", so the env below WINS over it. The competition
      # envelope therefore travels on the command line, where it can be read,
      # instead of in a marker file on the drone.
      #
      # It also has to be this way today: the CM4 is a WiFi AP with no uplink
      # (pypi unreachable, tested), so `deploy.sh --install` cannot build a
      # second venv on it, and the laptop's x86_64 .venv cannot be copied to
      # aarch64 — which is exactly why deploy.sh excludes .venv/.
      #
      # Practice and competition differ ONLY by the env in `entry`, so BOTH
      # icons now state theirs explicitly — neither depends on the drone's
      # .aavc_site. That file decides one case only: someone ssh'ing in and
      # typing run_mission.sh by hand. On 2026-08-25 the drone's default was
      # moved to the COMPETITION field so that case fails SAFE at KMITL
      # (ceiling 30 since the 28-Aug briefing / transit 20, the rules envelope) instead of silently
      # flying the practice 10 m / 9 m. deploy.sh gained --exclude '.aavc_site'
      # the same day so a routine code deploy can never push the laptop's
      # practice marker back over it.
      # Check the line the script prints on every launch either way:
      #     🌐 SITE: profile=competition  config=sitl/kmitl_config.yaml
      repo: "{repo}/mission"
      dir: "mission"             # โฟลเดอร์ที่มีอยู่จริงบน CM4 (~/mission)
      # RC_GO=1 is run_mission.sh's own REAL default: this only STAGES; the RC
      # pilot arms and flips OFFBOARD.
      entry: "REAL=1 AAVC_PROFILE=competition AAVC_CONFIG=sitl/kmitl_config.yaml ~/mission/sitl/run_mission.sh {ids}"
  bangbo:
    label: "ทดสอบ landing สนาม ร.ร.บางบ่อวิทยาคม (เพดาน 10 m, practice envelope)"
    field: "{repo}/mission/gcs/bangbo_field.yaml"
    captures: "{repo}/mission/captures"
    # ⚠ 2026-09-02: เดิมบรรทัดนี้ชี้ไป aavc-comp/sitl/run_mission.sh โดยไม่ส่ง env
    #   ⇒ .aavc_site ของ repo นั้นคือ **สนามแข่ง** ปุ่ม 🚀 บางบ่อฝั่ง SIM จึงบิน
    #   ด้วย competition + kmitl_config มาตลอด ไม่ใช่ config บางบ่อ
    #   (ฝั่งเครื่องจริงถูกอยู่แล้ว — real.entry ระบุ env ครบ)
    mission_cmd: "env AAVC_PROFILE=kmutnb_skyfield AAVC_CONFIG=sitl/bangbo_config.yaml '{repo}/mission/sitl/run_mission.sh' {ids}"
    mission_label: ""
    real:
      repo: "{repo}/mission"
      dir: "mission"
      entry: "REAL=1 AAVC_PROFILE=kmutnb_skyfield AAVC_CONFIG=sitl/bangbo_config.yaml ~/mission/sitl/run_mission.sh {ids}"
